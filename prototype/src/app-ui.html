<script>
'use strict';

/* =====================================================================
   Små byggeklodser
   ===================================================================== */
function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }
const pill = (st, text) => `<span class="pill ${st}">${esc(text || ST[st] || st)}</span>`;
const kr = (n) => `${Math.round(n).toLocaleString('da-DK')} kr.`;
const tc = (sec) => `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(Math.round(sec % 60)).padStart(2, '0')}`;

function frameBox(p, s, which = 'frame', n = null, opts = {}) {
  const slot = s[which];
  const v = n ? slot.versions.find((x) => x.n === n) : (slot.approved ? slot.versions.find((x) => x.n === slot.approved) : latest(slot));
  let inner = '';
  if (!v) inner = `<div class="empty">${which === 'frame' ? 'Ingen startframe endnu' : 'Ingen video endnu'}</div>`;
  else if (v.status === 'generating') inner = `<div class="shimmer">Genererer …</div>`;
  else if (v.status === 'failed') inner = sceneSVG(p, s, v.seed) + `<div class="shimmer" style="background:var(--st-fail-bg);color:var(--st-fail);animation:none">Fejlet</div>`;
  else {
    const dev = s.deviations.find((d) => d.type === 'attr' && d.attr === 'Hovedbeklædning');
    inner = sceneSVG(p, s, v.seed, { capOverride: dev ? '#2f5fae' : null });
    if (which === 'video' && !opts.noPlay) inner += `<button class="playbtn" data-act="play" data-id="${s.id}" aria-label="Afspil ${esc(s.code)}"><svg viewBox="0 0 16 16"><path d="M4 2 L14 8 L4 14 Z" fill="#fff"/></svg></button>`;
  }
  const playing = (S.playing === s.id && which === 'video') || opts.forcePlay;
  const dim = v && v.status === 'rejected' && !opts.noDim;
  return `<div class="frame ${dim ? 'dim' : ''} ${playing ? 'playing m-' + s.camera.move : ''}" style="--dur:${s.duration}s">${inner}${opts.tc === false ? '' : `<span class="tc">${which === 'video' ? '▶ ' : ''}${tc(s.duration)}</span>`}${opts.over ? `<div class="over">${opts.over}</div>` : ''}</div>`;
}
function avatarSVG(a) {
  const mv = assetMasterV(a) || assetLatest(a);
  const role = REF_ROLES[a.kind][0][0];
  const ref = mv.refs[role];
  if (ref && ref.src === 'upload') return `<img alt="" src="${ref.data}">`;
  if (!ref) return '';
  return assetSVG(a, role, 1, mv.v);
}
function avatar(a) {
  const inner = avatarSVG(a);
  return `<div class="avatar">${inner || `<div style="display:grid;place-items:center;height:100%;color:var(--faint);font-family:var(--mono);font-size:10px">${KIND[a.kind].code}</div>`}</div>`;
}
function faces(p, s) {
  return `<span class="faces">${s.assets.map((r) => { const a = p.assets[r.id]; if (!a) return ''; const old = a.master && r.v < a.master && !r.pinned; return `<span class="${old ? 'old' : !a.master ? 'wait' : ''}" title="${esc(a.name)} v${r.v}${old ? ' — forældet' : !a.master ? ' — ikke godkendt' : ''}">${avatarSVG(a)}</span>`; }).join('')}</span>`;
}
function chip(p, r) {
  const a = p.assets[r.id]; if (!a) return '';
  const stale = a.master && r.v < a.master && !r.pinned;
  return `<button class="chip ${stale ? 'stale' : !a.master ? 'warn' : ''}" data-act="openAsset" data-id="${a.id}"><span class="k">${KIND[a.kind].code}</span>${esc(a.name)}<span class="v">v${r.v}${r.pinned ? ' · fastholdt' : ''}</span></button>`;
}
const gateList = (g) => `<div class="stack tight">${g.map((x) => `<div class="gate ${x.ok ? 'ok' : 'no'}"><span class="ic">${x.ok ? '✓' : '×'}</span><span>${esc(x.text)}</span></div>`).join('')}</div>`;

/* =====================================================================
   Ramme: topbar, navigation, statuslinje
   ===================================================================== */
const NAV = [
  ['storyboard', 'Storyboard'],
  ['brief', 'Brief og Film DNA'],
  ['characters', 'Karakterer'],
  ['world', 'Locations og aktiver'],
  ['production', 'Produktion'],
];
function navActive(v) {
  if (S.view === v) return true;
  if (S.view === 'shot') return v === 'storyboard';
  if (S.view === 'asset') { const a = P().assets[S.assetId]; return a && (a.kind === 'character' ? v === 'characters' : v === 'world'); }
  return false;
}
function render() {
  const active = document.activeElement;
  const keep = active && active.id ? { id: active.id, s: active.selectionStart, e: active.selectionEnd } : null;
  const p = S.pid ? P() : null;
  let body = '';
  try { body = p ? projectView(p) : S.view === 'new' ? viewNew() : viewProjects(); }
  catch (err) { console.error(err); body = `<div class="notice fail">Prototypen løb ind i en fejl: ${esc(err.message)} <button class="btn sm" data-act="reset">Nulstil demo</button></div>`; }
  document.title = PRODUCT_NAME;
  document.getElementById('root').innerHTML = `<div class="app">${topbar(p)}${sidenav(p)}<main>${body}</main>${statusbar(p)}</div>${sheet()}${player()}${toasts()}`;
  if (keep) { const el = document.getElementById(keep.id); if (el) { el.focus(); try { if (keep.s != null) el.setSelectionRange(keep.s, keep.e); } catch (e) { /* ikke et tekstfelt */ } } }
  save();
}
function topbar(p) {
  return `<header class="topbar">
    <button class="brand" data-act="home"><span class="brand-mark"><svg viewBox="0 0 16 16"><rect x="1" y="5" width="14" height="10" rx="1.5" fill="#fff"/><path d="M1 5 L3.5 1.5 L6.5 1.5 L4 5 M6.5 5 L9 1.5 L12 1.5 L9.5 5" stroke="#fff" stroke-width="1.4" fill="none"/></svg></span>${esc(PRODUCT_NAME)}</button>
    ${p ? `<div class="crumb"><span>/</span><strong>${esc(p.title)}</strong>${p.demo ? '<span class="pill draft">Demo · Golden Test Case</span>' : ''}</div>` : ''}
    <div class="spacer"></div>
    <span class="proto-tag">Prototype · simulerede AI-svar</span>
    <button class="btn sm" data-act="reset" title="Starter demoen forfra">Nulstil demo</button>
  </header>`;
}
function sidenav(p) {
  if (!p) return `<nav class="sidenav" aria-label="Hovedmenu"><div class="navgroup"><div class="label">Studie</div><button class="navitem active" data-act="home"><span class="grow">Alle film</span></button></div></nav>`;
  const wait = waitingCount(p), run = runningJobs(p).length;
  const dot = { brief: agg([p.brief.status, p.dna.status]), storyboard: p.storyboard.status,
    characters: agg(Object.values(p.assets).filter((a) => a.kind === 'character').map(assetStatus)),
    world: agg(Object.values(p.assets).filter((a) => a.kind !== 'character').map(assetStatus)) };
  return `<nav class="sidenav" aria-label="Projektmenu"><div class="navgroup"><div class="label">Filmen</div>${NAV.map(([v, t]) => {
    const extra = v === 'production' ? `${wait ? `<span class="badge">${wait}</span>` : ''}${run ? `<span class="badge gen">${run}</span>` : ''}` : dot[v] ? `<span class="pill bare ${dot[v]}" style="font-size:0" title="${ST[dot[v]]}"></span>` : '';
    return `<button class="navitem ${navActive(v) ? 'active' : ''}" data-act="nav" data-view="${v}"><span class="grow">${t}</span>${extra}</button>`;
  }).join('')}</div><div class="navgroup"><div class="label">Studie</div><button class="navitem" data-act="home"><span class="grow">Alle film</span></button></div></nav>`;
}
function statusbar(p) {
  if (!p) return '<div class="statusbar"><span class="muted">Prototype · AI-svar og billeder er simulerede med data fra Golden Test Case. Intet sendes til nogen AI-provider.</span></div>';
  const shots = shotList(p);
  const fa = shots.filter((s) => frameStatus(p, s) === 'approved').length;
  const vg = shots.filter((s) => ['needs_approval', 'approved', 'outdated'].includes(videoStatus(p, s))).length;
  const va = shots.filter((s) => videoStatus(p, s) === 'approved').length;
  const sep = '<span class="sep">·</span>';
  const run = runningJobs(p).length;
  return `<div class="statusbar"><span><b>${shots.length}</b> shots</span>${sep}<span><b>${fa}</b> startframes godkendt</span>${sep}<span><b>${vg}</b> videoer genereret</span>${sep}<span><b>${va}</b> godkendt</span>${sep}<button class="btn ghost sm" style="padding:0;color:var(--st-need)" data-act="nav" data-view="production"><b>${waitingCount(p)}</b>&nbsp;venter på dig</button>${run ? `${sep}<span style="color:var(--st-gen)"><b>${run}</b> genererer</span>` : ''}<span class="grow"></span><span class="muted">Budget ${kr(p.budget.spent)} af ${kr(p.budget.limit)}</span></div>`;
}
function projectView(p) {
  switch (S.view) {
    case 'brief': return viewBrief(p);
    case 'characters': return viewAssets(p, 'character');
    case 'world': return viewAssets(p, 'world');
    case 'asset': { const a = p.assets[S.assetId]; return viewAssets(p, a && a.kind === 'character' ? 'character' : 'world'); }
    case 'shot': return viewShot(p);
    case 'production': return viewProduction(p);
    default: return viewStoryboard(p);
  }
}

/* =====================================================================
   Alle film + ny film
   ===================================================================== */
function viewProjects() {
  const list = S.order.map((id) => S.projects[id]);
  return `<div class="pagehead"><div><h1>Dine film</h1><p class="sub">En film er et storyboard. Alt andet — karakterer, locations, billeder og video — hænger på storyboardets shots.</p></div><button class="btn primary" data-act="newProject">+ Ny film</button></div>
  <div class="stack">${list.map((p) => {
    const shots = shotList(p);
    const first = shots.find((s) => latest(s.frame) && latest(s.frame).status === 'approved');
    const done = shots.filter((s) => videoStatus(p, s) === 'approved').reduce((a, s) => a + s.duration, 0);
    return `<button class="projcard" data-act="openProject" data-id="${p.id}">
      ${first ? frameBox(p, first, 'frame', null, { tc: false }) : `<div class="frame"><div class="empty">Ingen billeder endnu</div></div>`}
      <div class="stack tight">
        <div class="row between"><div class="row"><h2>${esc(p.title)}</h2>${p.demo ? '<span class="pill draft">Demo · Golden Test Case</span>' : ''}</div>${waitingCount(p) ? pill('needs_approval', `${waitingCount(p)} venter på dig`) : ''}</div>
        <p class="muted">${esc(p.idea.idea)}</p>
        ${shots.length ? `<div class="timeline" style="height:12px">${shots.map((s) => `<i class="${shotState(p, s).st}" style="flex:${s.duration}"></i>`).join('')}</div>` : ''}
        <div class="row small muted"><span class="mono">${tc(done)} / ${tc(totalSec(p) || p.idea.duration)}</span><span>·</span><span>${shots.length} shots</span><span>·</span><span>${Object.values(p.assets).length} aktiver</span><span>·</span><span>oprettet ${esc(p.created)}</span></div>
      </div></button>`;
  }).join('')}</div>
  <div class="card" style="margin-top:20px"><div class="row between"><h3>Statusser</h3><span class="small muted">Bruges ens overalt</span></div><div class="legend" style="margin-top:10px">${STATUS_ORDER.map((s) => pill(s)).join('')}</div></div>`;
}
function viewNew() {
  return `<div class="pagehead"><div><span class="label">Ny film</span><h1 style="margin-top:4px">Hvad er idéen?</h1><p class="sub">Svarene bliver til et Film Brief og en Film DNA, som du godkender, før instruktøren tegner storyboardet.</p></div></div>
  ${ideaForm(S.draftIdea, 'createProject', 'Opret film og foreslå brief')}`;
}
function ideaForm(d, act, label, locked) {
  const dis = locked ? 'disabled' : '';
  return `<form class="card pad-lg stack" data-form="${act}">
    <div class="formgrid">
      <label class="field full">Arbejdstitel<input type="text" id="f_title" data-bind="title" value="${esc(d.title)}" ${dis}></label>
      <label class="field full">Hvad handler filmen om?<textarea id="f_idea" rows="3" data-bind="idea" ${dis}>${esc(d.idea)}</textarea></label>
      <label class="field full">Hvad er budskabet?<textarea id="f_message" rows="2" data-bind="message" ${dis}>${esc(d.message)}</textarea></label>
      <label class="field">Hvem er målgruppen?<input type="text" id="f_audience" data-bind="audience" value="${esc(d.audience)}" ${dis}></label>
      <label class="field">Hvad skal seeren føle eller forstå?<input type="text" id="f_feeling" data-bind="feeling" value="${esc(d.feeling)}" ${dis}></label>
      <label class="field">Længde<span class="hint">sekunder</span><input type="number" id="f_duration" min="20" max="180" data-bind="duration" value="${esc(d.duration)}" ${dis}></label>
      <label class="field">Antal shots<span class="hint">instruktøren fordeler længden</span><select id="f_shots" data-bind="shots" ${dis}>${[4, 5, 6, 7, 8, 9, 10, 11, 12].map((n) => `<option ${Number(d.shots) === n ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      <label class="field">Stil<select id="f_style" data-bind="style" ${dis}>${['Mockumentary', 'Dokumentar', 'Reklame', 'Komedie', 'Drama'].map((s) => `<option ${s === d.style ? 'selected' : ''}>${s}</option>`).join('')}</select></label>
    </div>
    ${locked ? `<div class="notice info"><span>🔒</span><div class="grow"><p>Idéen er låst, fordi briefet er godkendt.</p><p class="muted small">En ændring laver et nyt brief (v2), og alt nedstrøms markeres som forældet — intet slettes.</p></div></div>` : `<div class="row"><button class="btn primary" type="submit">${label}</button>${act === 'createProject' ? '<button class="btn" type="button" data-act="useGolden">Brug Golden Test Case</button><button class="btn" type="button" data-act="home">Fortryd</button>' : ''}</div>`}
  </form>`;
}

/* =====================================================================
   Storyboard — filmens centrum
   ===================================================================== */
function nextStep(p) {
  if (p.brief.status === 'draft' || p.brief.status === 'rejected') return { text: 'Start med idéen. Instruktøren foreslår brief og Film DNA ud fra den.', act: 'nav', view: 'brief', tab: 'idea', btn: 'Gå til idé' };
  if (p.brief.status === 'generating') return { text: 'Instruktøren skriver brief og Film DNA …' };
  if (p.brief.status === 'needs_approval' || p.dna.status === 'needs_approval') return { text: 'Brief og Film DNA venter på dig.', act: 'nav', view: 'brief', tab: p.brief.status === 'needs_approval' ? 'brief' : 'dna', btn: 'Læs og godkend' };
  if (p.storyboard.status === 'draft') return { text: 'Briefet er godkendt. Lad instruktøren tegne storyboardet.', act: 'generateStoryboard', btn: 'Foreslå storyboard' };
  if (p.storyboard.status === 'generating') return { text: 'Instruktøren tegner storyboardet og finder karakterer, locations og props …' };
  if (p.storyboard.status === 'needs_approval') return { text: 'Se storyboardet igennem. Godkender du det, bliver det sandhedskilden for hele filmen.', act: 'approveStoryboard', btn: 'Godkend storyboard', approve: true };
  const w = waitingCount(p);
  const pk = packages(p);
  const nPk = pk.masters.list.length + pk.frames.list.length + pk.videos.list.length;
  if (w) return { text: `${w} ting venter på dig i Produktion.`, act: 'nav', view: 'production', btn: 'Åbn Production Control' };
  if (nPk) return { text: `Klar til produktion: ${[pk.masters.list.length && `${pk.masters.list.length} masters`, pk.frames.list.length && `${pk.frames.list.length} startframes`, pk.videos.list.length && `${pk.videos.list.length} videoer`].filter(Boolean).join(', ')}.`, act: 'nav', view: 'production', btn: `Start produktion · ${kr(pk.masters.cost + pk.frames.cost + pk.videos.cost)}` };
  const noConsent = Object.values(p.assets).find((a) => a.kind === 'character' && !a.consent && !a.master);
  if (noConsent) return { text: `${noConsent.name} mangler samtykke, før der må genereres billeder.`, act: 'openAsset', id: noConsent.id, btn: `Åbn ${noConsent.name}` };
  if (runningJobs(p).length) return { text: 'Produktionen kører. Shots dukker op her, når de er klar til gennemsyn.' };
  return { text: 'Alt, der kan produceres lige nu, er produceret. Afspil filmen for at se den samlet.', act: 'playFilm', btn: 'Afspil film' };
}
function nextBar(p) {
  const n = nextStep(p);
  return `<div class="notice info"><span>→</span><div class="grow"><p>${esc(n.text)}</p></div>${n.btn ? `<button class="btn ${n.approve ? 'approve' : 'primary'} sm" data-act="${n.act}" data-view="${n.view || ''}" data-tab="${n.tab || ''}" data-id="${n.id || ''}">${esc(n.btn)}</button>` : ''}${n.approve ? '<button class="btn reject sm" data-act="rejectStoryboard">Afvis</button>' : ''}</div>`;
}
function viewStoryboard(p) {
  const sb = p.storyboard;
  const shots = shotList(p);
  const total = totalSec(p) || p.idea.duration;
  const done = shots.filter((s) => videoStatus(p, s) === 'approved').reduce((a, s) => a + s.duration, 0);
  const head = `<div class="filmhead"><div class="titlerow"><div><span class="label">Storyboard${sb.version ? ' · v' + sb.version : ''} · sandhedskilden</span><h1 style="margin-top:4px">${esc(p.title)}</h1></div>
    <div class="row"><span class="filmtc" title="Godkendt video / filmens længde">${tc(done)} <span>/ ${tc(total)}</span></span>${shots.length ? `<button class="btn" data-act="playFilm">▶ Afspil film</button><div class="seg"><button class="${S.sbMode === 'strip' ? 'on' : ''}" data-act="sbMode" data-mode="strip">Billeder</button><button class="${S.sbMode === 'table' ? 'on' : ''}" data-act="sbMode" data-mode="table">Tabel</button></div>` : ''}</div></div>
    ${shots.length ? `<div class="timeline" role="list" aria-label="Filmens shots i rækkefølge">${shots.map((s) => { const st = shotState(p, s); return `<button role="listitem" class="${st.st}" style="flex:${s.duration}" data-act="openShot" data-id="${s.id}" title="${s.code} · ${s.duration} sek. · ${st.label}">${s.code.slice(5)}</button>`; }).join('')}</div>
    <div class="tl-legend"><span>Farven viser, hvor langt hvert shot er:</span>${['approved', 'needs_approval', 'generating', 'draft', 'outdated', 'failed'].map((s) => `<span class="row" style="gap:5px"><span class="dots"><i class="${s}"></i></span>${{ approved: 'Færdig', needs_approval: 'Venter på dig', generating: 'Genererer', draft: 'Ikke lavet', outdated: 'Forældet', failed: 'Fejlet' }[s]}</span>`).join('')}</div>` : ''}
    ${nextBar(p)}</div>`;
  if (sb.status === 'draft' || sb.status === 'generating') {
    return head + `<div class="card pad-lg">${sb.status === 'generating' ? `<div class="shimmer" style="position:relative;height:220px;border-radius:10px">Instruktøren tegner ${p.idea.shots || 8} shots og finder aktiverne …</div>` : `<div class="stack"><h2>Her bliver filmen til</h2><p class="muted">Når briefet er godkendt, tegner instruktøren ${p.idea.shots || 8} shots på ${p.idea.duration} sek. og trækker karakterer, locations, køretøjer og props ud som aktiver, du godkender hver for sig.</p></div>`}</div>`;
  }
  const borrowedSb = p.borrowed ? `<div class="notice info" style="margin-bottom:16px"><span>i</span><div class="grow small">Prototype: shots, karakterer og aktiver er lånt fra Golden Test Case, fordi der ikke er koblet en AI på.</div></div>` : '';
  if (S.sbMode === 'table') return head + borrowedSb + sbTable(p);
  const cells = [];
  let t = 0;
  for (const sc of p.scenes) {
    const list = shots.filter((s) => s.scene === sc.id);
    if (!list.length) continue;
    cells.push(`<div class="scene-divider"><span class="code">SCENE ${String(sc.n).padStart(2, '0')}</span><b>${esc(sc.heading)}</b><span class="muted small">${esc(sc.purpose)}</span></div>`);
    for (const s of list) { cells.push(shotFrame(p, s, t)); t += s.duration; }
  }
  return head + borrowedSb + `<div class="strip">${cells.join('')}</div>`;
}
function shotFrame(p, s, start) {
  const st = shotState(p, s);
  const fs = frameStatus(p, s), vs = videoStatus(p, s);
  const useVideo = latest(s.video) && ['approved', 'needs_approval'].includes(latest(s.video).status);
  return `<button class="sframe ${st.st === 'outdated' ? 'is-old' : st.label === 'Kræver et valg' ? 'is-warn' : ''}" data-act="openShot" data-id="${s.id}">
    ${frameBox(p, s, useVideo ? 'video' : 'frame', null, { noPlay: true })}
    <div class="cap1"><span class="shotcode">${s.code}</span><span class="tcs">${tc(start)} · ${s.duration} sek.</span></div>
    <p class="say">${esc(s.action)}</p>
    <div class="cap2">${pill(st.st, st.label)}<span class="row" style="gap:8px">${faces(p, s)}<span class="dots" title="Startframe: ${ST[fs]} · Video: ${ST[vs]}"><i class="${fs}"></i><i class="${vs}"></i></span></span></div>
  </button>`;
}
function sbTable(p) {
  const shots = shotList(p);
  const names = (s, kinds) => s.assets.filter((r) => p.assets[r.id] && kinds.includes(p.assets[r.id].kind)).map((r) => chip(p, r)).join(' ') || '<span class="faint">—</span>';
  return `<div class="card flush tablewrap"><table class="data"><thead><tr><th>Shot</th><th>Billede</th><th>Karakterer</th><th>Location</th><th>Køretøj og props</th><th>Kamera</th><th>Sek.</th><th>Startframe</th><th>Video</th></tr></thead><tbody>
  ${shots.map((s) => `<tr class="click" data-act="openShot" data-id="${s.id}"><td class="shotcode">${s.code}</td><td class="thumb">${frameBox(p, s, 'frame', null, { tc: false })}</td><td>${names(s, ['character'])}</td><td>${names(s, ['location'])}</td><td>${names(s, ['vehicle', 'prop'])}</td><td class="small">${SHOT_TYPES[s.camera.type]}<br><span class="mono muted">${s.camera.lens} mm · ${MOVES[s.camera.move]}</span></td><td class="mono">${s.duration}</td><td>${pill(frameStatus(p, s))}</td><td>${pill(videoStatus(p, s))}</td></tr>`).join('')}
  </tbody></table></div>`;
}

/* =====================================================================
   Brief, Film DNA og filmregler
   ===================================================================== */
function viewBrief(p) {
  const tab = S.briefTab;
  const tabs = [['idea', 'Idé', p.ideaStatus], ['brief', 'Film Brief', p.brief.status], ['dna', 'Film DNA', p.dna.status], ['rules', 'Filmregler', 'approved']];
  let body;
  if (tab === 'idea') {
    if (!S.draftIdea || S.draftIdea.pid !== p.id) S.draftIdea = { ...p.idea, pid: p.id };
    body = ideaForm(S.draftIdea, 'generateBrief', p.brief.version ? `Foreslå nyt brief (v${p.brief.version + 1})` : 'Foreslå brief og Film DNA', p.brief.status === 'approved' || p.brief.status === 'generating');
  } else if (tab === 'dna') body = dnaView(p);
  else if (tab === 'rules') body = rulesView(p);

function usage(p, a) { return shotList(p).filter((s) => s.assets.some((r) => r.id === a.id)); }

}
function assetDetail(p, a) {

    <div><div class="section-title"><h3>Referencer</h3><span class="small muted">${ver.status === 'approved' ? 'Låst — godkendt version' : 'Upload egne billeder, eller lad systemet generere'}</span></div>

/* =====================================================================
   Shot Editor: Instruktion → Produktion → AI-prompt

function compilePrompt(p, s) {
  const out = [];
  out.push(`<b>Film DNA v${p.dna.version}:</b> ${DNA_FIELDS.map((f) => `${f.toLowerCase()}: ${esc(p.dna.fields[f])}`).join('; ')}`);
  const rules = p.rules.filter((r) => r.on).map((r) => r.text.toLowerCase());
  if (rules.length) out.push(`<b>Undgå (filmregler):</b> ${esc(rules.join('; '))}`);
  out.push(`<b>Kamera:</b> ${SHOT_TYPES[s.camera.type]}, ${s.camera.lens} mm, ${MOVES[s.camera.move].toLowerCase()}, ${s.duration} sek.`);
  for (const r of s.assets) {
    const a = p.assets[r.id]; if (!a) continue;
    const v = a.versions.find((x) => x.v === r.v) || assetLatest(a);
    const attrs = Object.entries(v.attrs).map(([k, val]) => { const dev = s.deviations.find((d) => d.type === 'attr' && d.assetId === a.id && d.attr === k); return dev ? `${k.toLowerCase()}: <mark>${esc(dev.value)} (tilladt afvigelse)</mark>` : `${k.toLowerCase()}: ${esc(val)}`; }).join('; ');
    out.push(`<b>${KIND[a.kind].label} ${esc(a.code)} v${r.v}</b> — ${esc(a.name)}: ${attrs}. [${Object.keys(v.refs).length} referencebilleder vedlagt]`);
  }
  let action = esc(s.action), notes = esc(s.notes);
  for (const c of openConflicts(p, s)) { const m = esc(c.shot); action = action.replace(m, `<mark>${m}</mark>`); notes = notes.replace(m, `<mark>${m}</mark>`); }
  out.push(`<b>Handling:</b> ${action}`);
  out.push(`<b>Spil:</b> ${esc(s.performance.toLowerCase())}`);
  if (s.dialogue) out.push(`<b>Replik (til lyd, MVP 4):</b> "${esc(s.dialogue)}"`);
  if (s.notes) out.push(`<b>Noter:</b> ${notes}`);
  out.push(`<b>Lys:</b> ${esc(s.lighting)}`);
  return out.join('\n');
}
function conflictCard(p, s, c) {

function viewShot(p) {

  const fs = frameStatus(p, s), vs = videoStatus(p, s);
  const fg = frameGates(p, s), vg = videoGates(p, s);
  const oc = openConflicts(p, s);
  const stale = staleRefs(p, s);
  const lf = latest(s.frame), lv = latest(s.video);

  const slotAction = (which, cur, gates, st) => {

    return gatesOk(gates) ? genBtn(cur.status === 'failed' ? 'Prøv igen' : 'Generér ny version') : '';
  };

  const lv1 = `<div class="card stack">
      <label class="field">Hvad skal ske?<span class="hint">Skriv det, som du ville sige det til en fotograf</span><textarea class="director" id="sp_action_${s.id}" rows="4" data-spec="action" data-id="${s.id}">${esc(s.action)}</textarea></label>

        <label class="field">Beskæring<select id="sp_type_${s.id}" data-spec="type" data-id="${s.id}">${Object.entries(SHOT_TYPES).map(([k, v]) => `<option value="${k}" ${k === s.camera.type ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
        <label class="field">Spil<select id="sp_perf_${s.id}" data-spec="performance" data-id="${s.id}">${PERFORMANCE.map((v) => `<option ${v === s.performance ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
        <label class="field full">Noter<span class="hint">Fri tekst — tjekkes mod karakterer, locations og filmregler</span><textarea id="sp_notes_${s.id}" rows="2" data-spec="notes" data-id="${s.id}" placeholder="Fx: ser træt ud, har mudder på støvlerne">${esc(s.notes)}</textarea></label>
      </div>
      <div class="row"><button class="btn sm" data-act="checkSpec" data-id="${s.id}">Tjek kontinuitet</button><span class="small muted">Tjekket kører også automatisk, før der betales for noget.</span></div>
    </div>`;
  const lv2 = `<div class="card stack">

      ${s.fixLog.length ? `<div class="stack tight"><span class="label">Rettelser og afvigelser</span>${s.fixLog.map((f) => `<div class="fixlog"><span class="who">SYSTEM</span><span class="grow">${esc(f.text)}</span>${f.undo ? `<button class="btn ghost sm" data-act="undoFix" data-id="${s.id}" data-fix="${f.id}">Fortryd</button>` : ''}</div>`).join('')}</div>` : ''}
    </div>`;

  const recoBox = (slot, r) => `<div class="reco"><div class="row between"><span class="label">${slot === 'frame' ? 'Startframe' : 'Video'}</span>${r.manual ? '<span class="small muted">valgt af dig</span>' : '<span class="small muted">anbefalet</span>'}</div>

    ${p.providerMode === 'advanced' ? `<label class="field">Vælg selv<select id="sp_prov_${slot}_${s.id}" data-choice="${slot}" data-id="${s.id}"><option value="">Automatisk (${esc(r.cands[0] ? r.cands[0].name : '—')})</option>${r.cands.map((m) => `<option value="${m.id}" ${s.choice && s.choice[slot] === m.id ? 'selected' : ''}>${esc(m.name)} · ${kr(m.price)}</option>`).join('')}</select></label>` : ''}`
    : `<span class="small" style="color:var(--st-fail)">Ingen provider kan lave dette shot: ${r.excluded.map((x) => `${esc(x.name)} ${esc(x.why)}`).join('; ')}. Ret varighed eller kamera under Instruktion.</span>`}</div>`;
  const lv3 = `<div class="card stack">
      <div class="row between"><h3>Hvilken AI-model?</h3><div class="seg"><button class="${p.providerMode === 'auto' ? 'on' : ''}" data-act="providerMode" data-mode="auto">Automatisk</button><button class="${p.providerMode === 'advanced' ? 'on' : ''}" data-act="providerMode" data-mode="advanced">Avanceret</button></div></div>
      <p class="small muted">${p.providerMode === 'auto' ? 'Systemet vælger ud fra shottets behov. Du behøver ikke kende modellerne.' : 'Du kan vælge model pr. shot. Kun modeller, der kan lave shottet, kan vælges.'}</p>
      ${recoBox('frame', rf)}${recoBox('video', rv)}
      <div class="section-title" style="margin:6px 0 0"><h3>Den prompt systemet bygger</h3><span class="small muted">Kan ses, ikke redigeres</span></div>
      <p class="small muted">Du instruerer filmen; systemet oversætter. Vil du ændre noget, så gør det under Instruktion eller Produktion — så følger ændringen med i kontinuitetstjek og versioner.</p>
      <div class="prompt">${compilePrompt(p, s)}</div>
    </div>`;

  return `<div class="pagehead"><div><button class="btn ghost" data-act="nav" data-view="storyboard" style="padding-left:0">← Storyboard</button><div class="row" style="margin-top:4px"><h1 class="mono" style="font-size:22px">${s.code}</h1>${pill(shotState(p, s).st, shotState(p, s).label)}<span class="muted">${tc(start)} · Scene ${sc ? sc.n : ''} · ${esc(sc ? sc.heading : '')}</span></div></div>
    <div class="row"><button class="btn sm" data-act="openShot" data-id="${prev.id}">← ${prev.code}</button><button class="btn sm" data-act="openShot" data-id="${next.id}">${next.code} →</button></div></div>
  ${stale.map((r) => { const a = p.assets[r.id]; const mv = a.versions.find((v) => v.v === a.master); return `<div class="notice old" style="display:block;margin-bottom:12px"><div class="row between" style="margin-bottom:8px"><b>Forældet aktiv</b><span class="small">${esc(a.name)}</span></div><dl class="why"><dt>Shottet bruger</dt><dd class="quote">${esc(a.name)} v${r.v}</dd><dt>Master er nu</dt><dd class="quote">v${a.master} — ${esc(mv.note || 'ny version')}</dd><dt>Konsekvens</dt><dd>Billede og video viser den gamle version. Opdaterer du, skal startframe og video laves igen; de gamle bevares i historikken.</dd></dl><div class="row" style="margin-top:10px"><button class="btn sm" data-act="updateRef" data-id="${s.id}" data-aid="${a.id}">Opdatér til v${a.master}</button><button class="btn sm" data-act="pinRef" data-id="${s.id}" data-aid="${a.id}">Behold v${r.v} bevidst</button></div></div>`; }).join('')}
  ${oc.map((c) => `<div style="margin-bottom:12px">${conflictCard(p, s, c)}</div>`).join('')}
  <div class="editor">
    <div class="stack">
      <div class="card stack">
        <div class="section-title" style="margin:0"><h2>Startframe</h2>${pill(fs)}</div>

        ${locked ? '<p class="small muted">Godkend storyboardet først.</p>' : slotAction('frame', lf, fg, fs)}
        ${!gatesOk(fg) && !locked ? `<div class="stack tight"><span class="label">Før startframe kan laves</span>${gateList(fg)}</div>` : ''}
      </div>
      <div class="card stack">

        ${frameBox(p, s, 'video', vSel)}
        ${lv && lv.status === 'failed' ? `<div class="notice fail"><span>×</span><div class="grow"><p>Alle providere fejlede. Intet er betalt: hvert job blev stoppet og bekræftet, før den næste provider blev prøvet.</p><button class="btn sm" style="margin-top:6px" data-act="prodTab" data-tab="queue">Se forløbet i køen</button></div></div>` : ''}
        ${!locked && fs === 'approved' ? slotAction('video', lv, vg, vs) : ''}
        ${!gatesOk(vg) && !locked && fs !== 'approved' ? `<p class="small muted">Video kan laves, når startframen er godkendt.</p>` : ''}
        ${s.video.versions.length > 1 ? `<div class="versionstrip">${s.video.versions.map((v) => `<button class="vcard ${v.n === vSel ? 'on' : ''}" data-act="selVideo" data-id="${s.id}" data-n="${v.n}">${frameBox(p, s, 'video', v.n, { tc: false, noDim: true, noPlay: true })}<span class="row small"><span class="mono">v${v.n}</span>${pill(v.status)}</span></button>`).join('')}</div>` : ''}
      </div>
    </div>
    <div class="stack">
      <div class="levels" role="tablist">${[['direct', '1', 'Instruktion'], ['prod', '2', 'Produktion'], ['ai', '3', 'AI-prompt']].map(([k, n, t]) => `<button role="tab" class="${S.level === k ? 'on' : ''}" data-act="level" data-level="${k}"><span class="n">${n}</span>${t}${k === 'prod' && (oc.length || stale.length) ? '<span class="dots"><i class="needs_approval"></i></span>' : ''}</button>`).join('')}</div>
      ${S.level === 'prod' ? lv2 : S.level === 'ai' ? lv3 : lv1}
    </div>
  </div>`;
}
function contRows(p, s) {
  const cons = conflicts(p, s);
  const rows = [];
  for (const r of s.assets) {
    const a = p.assets[r.id];
    const c = cons.filter((x) => x.type === 'attr' && x.assetId === a.id);
    if (!c.length) rows.push(`<div class="controw"><span>${esc(a.name)} v${r.v}</span><span class="res match">Match</span></div>`);
    for (const x of c) rows.push(`<div class="controw ${x.allowed ? '' : 'conflict'}"><span>${esc(a.name)} · ${esc(x.attr)}</span><span class="res ${x.allowed ? 'dev' : 'conflict'}">${x.allowed ? 'Tilladt afvigelse' : 'Konflikt'}</span></div>`);
  }
  const rc = cons.filter((x) => x.type === 'rule');
  rows.push(`<div class="controw ${rc.some((x) => !x.allowed) ? 'conflict' : ''}"><span>Filmregler (${p.rules.filter((r) => r.on).length})</span><span class="res ${rc.some((x) => !x.allowed) ? 'conflict' : rc.length ? 'dev' : 'match'}">${rc.some((x) => !x.allowed) ? 'Brudt' : rc.length ? 'Tilladt afvigelse' : 'Overholdt'}</span></div>`);
  return rows.join('');
}

/* =====================================================================
   Produktion: Production Control + kø
   ===================================================================== */
function viewProduction(p) {
  const tabs = `<div class="seg"><button class="${S.prodTab === 'control' ? 'on' : ''}" data-act="prodTab" data-tab="control">Production Control</button><button class="${S.prodTab === 'queue' ? 'on' : ''}" data-act="prodTab" data-tab="queue">Kø${runningJobs(p).length ? ` · ${runningJobs(p).length}` : ''}</button></div>`;
  const j = journey(p);
  const journeyBar = `<div class="card flush" style="margin-bottom:18px"><div class="journey" style="grid-template-columns:repeat(${j.length},minmax(0,1fr))">${j.map((x, i) => `<button class="jstep" data-act="nav" data-view="${x.view}" data-tab="${x.tab || ''}"><span class="bar ${x.status}"></span><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${x.t}</span>${pill(x.status)}<span class="c">${esc(x.c)}</span></button>`).join('')}</div></div>`;
  return `<div class="pagehead"><div><span class="label">Produktion</span><h1 style="margin-top:4px">${S.prodTab === 'queue' ? 'Produktionskø' : 'Production Control'}</h1><p class="sub">${S.prodTab === 'queue' ? 'Hvert forsøg hos hver provider. Fejler en provider, prøver systemet den næste — men først når det forrige job er bekræftet stoppet, så intet betales to gange.' : 'Her starter du produktionen. Betalte generationer samles i pakker med samlet pris, og alt, der venter på dit ja, ligger samme sted.'}</p></div>${tabs}</div>
  ${journeyBar}${S.prodTab === 'queue' ? queueTable(p) : controlView(p)}`;
}
function controlView(p) {
  const pk = packages(p);
  const sel = S.pkgSel;
  const thumbs = (list, kind) => `<div class="thumbs">${list.slice(0, 12).map((x) => kind === 'asset' ? `<div class="frame" title="${esc(x.name)}" style="aspect-ratio:1">${avatarSVG(x) || `<div class="empty">${KIND[x.kind].code}</div>`}</div>` : `<div class="frame" title="${x.code}">${kind === 'video' ? frameBox(p, x, 'frame', null, { tc: false }) : sceneSVG(p, x, 1)}</div>`).join('')}</div>`;
  const row = (key, title, sub, list, cost, kind) => `<label class="pkg ${list.length ? '' : 'off'}"><input type="checkbox" data-pkg="${key}" ${sel[key] && list.length ? 'checked' : ''} ${list.length ? '' : 'disabled'}><div><b>${title}</b><div class="small muted">${sub}</div>${list.length ? thumbs(list, kind) : ''}</div><div class="amt">${list.length ? `${list.length} stk.<br><b>${kr(cost)}</b>` : '—'}</div></label>`;
  const total = (sel.masters ? pk.masters.cost : 0) + (sel.frames ? pk.frames.cost : 0) + (sel.videos ? pk.videos.cost : 0);
  const count = (sel.masters ? pk.masters.list.length : 0) + (sel.frames ? pk.frames.list.length : 0) + (sel.videos ? pk.videos.list.length : 0);
  const review = reviewItems(p), choices = choiceItems(p);
  const reviewThumb = (i) => {
    if (i.type === 'frame') return frameBox(p, p.shots[i.id], 'frame', latest(p.shots[i.id].frame).n, { tc: false });
    if (i.type === 'video') return frameBox(p, p.shots[i.id], 'video', latest(p.shots[i.id].video).n, { tc: false, noPlay: true });
    if (i.type === 'asset') { const a = p.assets[i.id]; return `<div class="frame">${assetSVG(a, REF_ROLES[a.kind][0][0], 1, assetLatest(a).v)}</div>`; }
    return `<div class="frame"><div class="empty">${{ brief: 'Film Brief', dna: 'Film DNA', storyboard: 'Storyboard' }[i.type]}</div></div>`;
  };
  const reviewActs = (i) => {
    if (i.type === 'brief') return `<button class="btn approve sm" data-act="approveBrief">Godkend</button><button class="btn sm" data-act="nav" data-view="brief" data-tab="brief">Læs</button>`;
    if (i.type === 'dna') return `<button class="btn approve sm" data-act="approveDna">Godkend</button><button class="btn sm" data-act="nav" data-view="brief" data-tab="dna">Læs</button>`;
    if (i.type === 'storyboard') return `<button class="btn approve sm" data-act="approveStoryboard">Godkend</button><button class="btn sm" data-act="nav" data-view="storyboard">Se</button>`;
    if (i.type === 'asset') { const v = assetLatest(p.assets[i.id]).v; return `<button class="btn approve sm" data-act="approveAsset" data-id="${i.id}" data-v="${v}">Godkend som master</button><button class="btn reject sm" data-act="rejectAsset" data-id="${i.id}" data-v="${v}">Afvis</button>`; }
    const n = latest(p.shots[i.id][i.type]).n;
    return `<button class="btn approve sm" data-act="approveSlot" data-slot="${i.type}" data-id="${i.id}" data-n="${n}">Godkend</button><button class="btn reject sm" data-act="rejectSlot" data-slot="${i.type}" data-id="${i.id}" data-n="${n}">Afvis</button><button class="btn sm" data-act="openShot" data-id="${i.id}">Åbn</button>`;
  };
  const label = { brief: 'Brief', dna: 'Film DNA', storyboard: 'Storyboard', asset: 'Master', frame: 'Startframe', video: 'Video' };
  const nFrames = review.filter((i) => i.type === 'frame').length, nVids = review.filter((i) => i.type === 'video').length;
  return `<div class="control"><div class="stack">
    <div class="card flush"><div class="section-title" style="padding:14px 16px 0"><h2>Klar til produktion</h2><span class="small muted">Vælg hvad der skal laves</span></div>
      ${row('masters', 'Master-referencer', 'Karakterer og aktiver, der mangler en godkendt identitet', pk.masters.list, pk.masters.cost, 'asset')}
      ${row('frames', 'Startframes', 'Shots, der har alt, hvad de skal bruge', pk.frames.list, pk.frames.cost, 'frame')}
      ${row('videos', 'Video', 'Shots med godkendt startframe', pk.videos.list, pk.videos.cost, 'video')}
      <div class="pkg off"><input type="checkbox" disabled><div><b>Stemme og lyd</b><div class="small muted">Replikker og ambience ligger klar på shottene. Lyd produceres efter MVP 1.</div></div><div class="amt">kommer<br>senere</div></div>
    </div>
    ${pk.blocked.length ? `<div class="card stack"><div class="section-title" style="margin:0"><h2>Kan ikke produceres endnu</h2><span class="small muted">${pk.blocked.length} shots</span></div>${pk.blocked.map((s) => `<div class="row"><button class="btn ghost sm mono" style="padding:0" data-act="openShot" data-id="${s.id}">${s.code}</button><span class="small muted grow">${esc(firstBlock(frameGates(p, s)))}</span></div>`).join('')}</div>` : ''}
    <div class="card flush"><div class="section-title" style="padding:14px 16px 0"><h2>Til gennemsyn</h2><div class="row">${nFrames > 1 ? `<button class="btn approve sm" data-act="approveAll" data-slot="frame">Godkend alle ${nFrames} startframes</button>` : ''}${nVids > 1 ? `<button class="btn approve sm" data-act="approveAll" data-slot="video">Godkend alle ${nVids} videoer</button>` : ''}${pill(review.length ? 'needs_approval' : 'approved', review.length ? `${review.length} venter` : 'Intet venter')}</div></div>
      ${review.map((i) => `<div class="approvalitem">${reviewThumb(i)}<div class="stack tight"><span class="label">${label[i.type]}</span><b>${esc(i.title)}</b><span class="small muted">${esc(i.sub)}</span></div><div class="row acts">${reviewActs(i)}</div></div>`).join('') || '<p class="muted" style="padding:16px">Du er helt ajour.</p>'}
    </div>
    <div class="card flush"><div class="section-title" style="padding:14px 16px 0"><h2>Kræver et valg</h2>${pill(choices.length ? 'outdated' : 'approved', choices.length ? `${choices.length}` : 'Ingen')}</div>
      ${choices.map((i) => `<div class="approvalitem">${frameBox(p, p.shots[i.id], 'frame', null, { tc: false })}<div class="stack tight"><span class="label">${i.type === 'conflict' ? 'Kontinuitet' : 'Forældet aktiv'}</span><b>${esc(i.title)}</b><span class="small muted">${esc(i.sub)}</span></div><div class="row acts"><button class="btn sm" data-act="openShot" data-id="${i.id}">Afklar</button></div></div>`).join('') || '<p class="muted" style="padding:16px">Ingen konflikter.</p>'}
    </div>
  </div>
  <div class="card pad-lg totalbox"><span class="label">I alt</span><span class="big">${kr(total)}</span><span class="small muted">${count} generationer · anbefalede modeller</span>
    <div class="stack tight"><div class="row between small"><span>Budget efter dette</span><span class="mono">${kr(p.budget.spent + total)} af ${kr(p.budget.limit)}</span></div><div class="budget"><i style="width:${Math.min(100, (p.budget.spent / p.budget.limit) * 100)}%;background:var(--muted)"></i><i style="width:${Math.min(100, (total / p.budget.limit) * 100)}%;background:var(--accent)"></i></div></div>
    ${p.budget.spent + total > p.budget.limit ? '<div class="notice fail"><span>!</span><div class="grow small">Over budget. Fravælg en pakke, eller hæv budgettet.</div></div>' : ''}
    <button class="btn primary" style="justify-content:center;padding:12px" data-act="startProduction" ${count && p.budget.spent + total <= p.budget.limit ? '' : 'disabled'}>Godkend produktion</button>
    <p class="small muted">Dit ja reserverer beløbet. Hvert resultat skal stadig godkendes bagefter, før det bruges i filmen. Masters laves før startframes, startframes før video.</p>
    <div class="divider"></div>
    <div class="row between small"><span>Valg af model</span><div class="seg"><button class="${p.providerMode === 'auto' ? 'on' : ''}" data-act="providerMode" data-mode="auto">Automatisk</button><button class="${p.providerMode === 'advanced' ? 'on' : ''}" data-act="providerMode" data-mode="advanced">Avanceret</button></div></div>
  </div></div>`;
}
function jobTarget(p, j) {
  if (j.target.type === 'asset') { const a = p.assets[j.target.id]; if (!a) return { code: '—', label: '', status: 'draft', open: '' }; return { code: a.code, label: 'Master-referencer', status: (a.versions.find((v) => v.v === j.target.n) || {}).status, open: `data-act="openAsset" data-id="${a.id}"` }; }
  const s = p.shots[j.target.id]; if (!s) return { code: '—', label: '', status: 'draft', open: '' };
  const v = s[j.target.slot].versions.find((x) => x.n === j.target.n);
  return { code: s.code, label: j.target.slot === 'frame' ? `Startframe v${j.target.n}` : `Video v${j.target.n}`, status: v ? v.status : 'draft', open: `data-act="openShot" data-id="${s.id}"` };
}
function queueTable(p) {
  const jobs = p.jobs.slice().reverse();
  const attemptSt = { done: ['approved', 'Leveret'], failed: ['failed', 'Fejlet'], waiting: ['draft', 'Venter'], generating: ['generating', 'Genererer'] };
  const rows = [];
  for (const j of jobs) {
    const t = jobTarget(p, j);
    const outcome = j.status === 'done' ? pill(t.status) : j.status === 'failed' ? pill('failed') : pill('generating');
    j.attempts.forEach((a, i) => {
      const [st, lab] = attemptSt[a.status] || ['draft', a.status];
      rows.push(`<tr class="${i ? 'sub' : ''}">
        <td>${i ? '' : `<button class="btn ghost sm mono" style="padding:0" ${t.open}>${esc(t.code)}</button>`}</td>
        <td>${i ? '<span class="arrow">↳ reserve</span>' : esc(t.label)}</td>
        <td>${esc(a.provider)}</td>
        <td class="st">${pill(st, lab)}</td>
        <td class="small muted">${esc(a.note || '')}</td>
        <td>${i === j.attempts.length - 1 ? outcome : ''}</td>
        <td class="mono small">${i ? '' : `${kr(j.cost)} · ${esc(j.at)}`}</td>
        <td>${i === j.attempts.length - 1 && j.status === 'failed' ? `<button class="btn sm" data-act="retryJob" data-job="${j.id}">Prøv igen</button>` : i === j.attempts.length - 1 && t.status === 'needs_approval' ? `<button class="btn sm" ${t.open}>Se og godkend</button>` : ''}</td>
      </tr>`);
    });
  }
  return `<div class="card flush tablewrap"><table class="data qtable"><thead><tr><th>Shot</th><th>Opgave</th><th>Provider</th><th>Forsøg</th><th>Forløb</th><th>Resultat</th><th>Pris</th><th></th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
}

/* =====================================================================
   Ark, afspiller, beskeder
   ===================================================================== */
function sheet() {

/* =====================================================================
   Simuleret produktion
   ===================================================================== */
function versionOf(p, j) {
  if (j.target.type === 'asset') { const a = p.assets[j.target.id]; return a ? a.versions.find((x) => x.v === j.target.n) : null; }
  const s = p.shots[j.target.id]; return s ? s[j.target.slot].versions.find((x) => x.n === j.target.n) : null;
}
function finishJob(pid, j, ok) {
  const p = S.projects[pid]; if (!p) return;
  const v = versionOf(p, j); const last = j.attempts[j.attempts.length - 1];
  if (ok) {
    last.status = 'done'; last.note = 'Leveret'; j.status = 'done'; p.budget.spent += j.cost;
    if (v) {
      v.status = 'needs_approval'; v.provider = last.provider;
      if (j.target.type === 'asset') { const a = p.assets[j.target.id]; for (const [r] of REF_ROLES[a.kind].slice(0, a.kind === 'character' ? 4 : 3)) if (!v.refs[r]) v.refs[r] = { src: 'gen' }; }
    }
    const t = jobTarget(p, j); toast(`${t.code}: ${t.label.toLowerCase()} er klar til gennemsyn`);
  } else { j.status = 'failed'; if (v) v.status = 'failed'; }
  render();
}
/* Kører et job. failover=true: første provider fejler teknisk, den næste overtager. */
function runJob(pid, j, ms, failover = false) {
  j.status = 'generating';
  const cur = j.attempts[j.attempts.length - 1];
  if (cur.status === 'waiting') {
    setTimeout(() => { cur.status = 'generating'; cur.note = ''; render(); }, 1200);
    setTimeout(() => finishJob(pid, j, true), 1200 + ms);
    return;
  }
  cur.status = 'generating';
  if (!failover) { setTimeout(() => finishJob(pid, j, true), ms); return; }
  setTimeout(() => {
    const p = S.projects[pid]; if (!p) return;
    cur.status = 'failed'; cur.note = 'Teknisk fejl: intet svar. Stoppet og bekræftet — ikke betalt.';
    const alt = PROVIDERS.video.find((m) => m.name !== cur.provider);
    j.attempts.push({ provider: alt.name, status: 'waiting', note: 'Venter på ledig kapacitet' }); j.provider = alt.name;
    const v = versionOf(p, j); if (v) v.provider = alt.name;
    render();
    runJob(pid, j, ms);
  }, ms * 0.6);
}
function startGen(p, slot, shotId) {
  const s = p.shots[shotId];
  const r = recommend(p, s, slot); if (!r.pick) return;
  const n = s[slot].versions.length + 1;
  s[slot].versions.push(mkVersion(n, 'generating', { provider: r.pick.name }));
  const j = { id: nextId('job'), target: { type: 'shot', id: shotId, slot, n }, slot, provider: r.pick.name, cost: r.pick.price, status: 'queued', at: 'lige nu', attempts: [{ provider: r.pick.name, status: 'generating', note: '' }] };
  p.jobs.push(j);
  const doFailover = slot === 'video' && !!r.fallback && !!p.flags && p.flags.failoverOnFirstVideo && !p.flags.failoverUsed;
  if (doFailover) p.flags.failoverUsed = true;
  runJob(p.id, j, slot === 'frame' ? 2000 + Math.random() * 1400 : 3400 + Math.random() * 1600, doFailover);
}
function startMaster(p, a) {
  const ver = assetLatest(a);
  ver.status = 'generating';
  const j = { id: nextId('job'), target: { type: 'asset', id: a.id, n: ver.v }, slot: 'master', provider: 'Billedmodel B', cost: MASTER_PRICE, status: 'queued', at: 'lige nu', attempts: [{ provider: 'Billedmodel B', status: 'generating', note: '' }] };
  p.jobs.push(j);
  runJob(p.id, j, 2000 + Math.random() * 1200);
}
function genBrief(p) {
  p.brief.status = 'generating'; p.dna.status = 'generating'; p.ideaStatus = 'approved';
  setTimeout(() => {
    const sp = S.projects[p.id]; if (!sp) return;
    sp.brief.version += 1; sp.dna.version = Math.max(1, sp.dna.version);
    // Brugerens egne svar bruges, hvor de findes. Resten er lånt fra Golden Test Case,
    // fordi prototypen ikke har en rigtig AI koblet på — og det siges tydeligt i UI'et.
    const first = (sp.idea.idea || '').split(/(?<=\.)\s/)[0];
    sp.brief.content = { ...GOLDEN_BRIEF, logline: first || GOLDEN_BRIEF.logline, message: sp.idea.message || GOLDEN_BRIEF.message, audience: sp.idea.audience || GOLDEN_BRIEF.audience, feeling: sp.idea.feeling || GOLDEN_BRIEF.feeling, duration: Number(sp.idea.duration) || 60, style: sp.idea.style || GOLDEN_BRIEF.style };
    sp.dna.fields = { ...GOLDEN_DNA, 'Genre': sp.idea.style === 'Mockumentary' ? GOLDEN_DNA['Genre'] : sp.idea.style };
    if (!sp.rules.length) sp.rules = GOLDEN_RULES.map((r) => ({ ...r }));

}

  },
  checkSpec(d) { const p = P(); const n = openConflicts(p, p.shots[d.id]).length; toast(n ? `${n === 1 ? 'Én konflikt' : n + ' konflikter'} fundet — se forklaringen øverst.` : 'Ingen konflikter. Shottet følger aktiverne og filmreglerne.'); },

  confirmSheet() { const sh = S.sheet; S.sheet = null; if (sh && sh.run) sh.run(); },
  closeSheet() { S.sheet = null; },
};
function openSheet(sh) { S.sheet = sh; }
function schedulePlayer() {
  const pl = S.player; if (!pl) return;
  const p = P(); const shots = shotList(p); const s = shots[pl.i]; if (!s) return;
  const token = pl.token;
  setTimeout(() => {
    if (!S.player || S.player.token !== token) return;
    if (pl.i + 1 >= shots.length) { S.player = null; toast('Filmen er slut.'); render(); return; }
    S.player = { i: pl.i + 1, token: nextId('pl') }; render(); schedulePlayer();
  }, Math.max(1500, s.duration * 1000));
}
function resumeDemo() {
  for (const p of Object.values(S.projects)) {
    for (const j of p.jobs) if (j.status === 'generating' || j.status === 'queued') runJob(p.id, j, 3000 + Math.random() * 2500);
    if (p.brief.status === 'generating') genBrief(p);
    if (p.storyboard.status === 'generating') { p.storyboard.status = 'draft'; p.storyboard.version = Math.max(0, p.storyboard.version - 1); }
  }
}

/* =====================================================================
   Hændelser
   ===================================================================== */
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  if (el.classList.contains('scrim') && ev.target !== el) return;
  if (el.tagName === 'LABEL') return;
  ev.preventDefault();
  const fn = ACT[el.dataset.act];
  if (fn) { fn({ ...el.dataset }, el, ev); render(); if (['nav', 'openShot', 'openAsset', 'openProject', 'newProject', 'home', 'briefTab', 'prodTab'].includes(el.dataset.act)) window.scrollTo(0, 0); }
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape' && (S.sheet || S.player)) { S.sheet = null; S.player = null; render(); }
});
document.addEventListener('submit', (ev) => {
  ev.preventDefault();
  const act = ev.target.dataset.form; if (ACT[act]) { ACT[act](); render(); window.scrollTo(0, 0); }
});
document.addEventListener('input', (ev) => {
  const t = ev.target;
  if (t.dataset.bind && S.draftIdea) { S.draftIdea[t.dataset.bind] = t.value; save(); return; }
  if (t.dataset.dna) { P().dna.fields[t.dataset.dna] = t.value; save(); return; }
  if (t.dataset.attr) { const a = P().assets[t.dataset.aid]; const v = a.versions.find((x) => x.v === Number(t.dataset.v)); v.attrs[t.dataset.attr] = t.value; save(); return; }
  if (t.dataset.spec) {
    const s = P().shots[t.dataset.id]; const k = t.dataset.spec;
    if (['type', 'move', 'lens'].includes(k)) s.camera[k] = k === 'lens' ? Number(t.value) : t.value;
    else if (k === 'duration') s.duration = Math.max(1, Math.min(15, Number(t.value) || 1));
    else s[k] = t.value;
    save();
  }
});
document.addEventListener('change', (ev) => {
  const t = ev.target;
  if (t.dataset.pkg) { S.pkgSel[t.dataset.pkg] = t.checked; render(); return; }
  if (t.dataset.choice) { const s = P().shots[t.dataset.id]; s.choice = s.choice || {}; s.choice[t.dataset.choice] = t.value || undefined; render(); return; }
  if (t.dataset.spec && t.tagName === 'SELECT') { render(); return; }
  if (t.dataset.upload) {
    const file = t.files && t.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = () => { const a = P().assets[t.dataset.upload]; const v = a.versions.find((x) => x.v === Number(t.dataset.v)); v.refs[t.dataset.role] = { src: 'upload', data: r.result }; toast('Referencen er uploadet.'); render(); };
    r.readAsDataURL(file);
  }
});

resumeDemo();
render();
</script>
