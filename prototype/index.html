}
function toasts() { return `<div class="toasts" aria-live="polite">${S.toasts.map((t) => `<div class="toast">${esc(t.text)}</div>`).join('')}</div>`; }
function toast(text) { const t = { id: nextId('t'), text }; S.toasts.push(t); setTimeout(() => { S.toasts = S.toasts.filter((x) => x.id !== t.id); render(); }, 3200); }

/* =====================================================================
   Simulering af generering
   ===================================================================== */
function runJob(pid, job, ms, outcome = 'ok') {
  job.status = 'queued';
  setTimeout(() => { job.status = 'generating'; setVersionStatus(pid, job, 'generating'); render(); }, 500);
  setTimeout(() => {
    const p = S.projects[pid]; if (!p) return;
    if (outcome === 'ok') { job.status = 'done'; setVersionStatus(pid, job, 'needs_approval'); p.budget.spent += job.cost; toast(`${jobTarget(p, job).code}: ${jobTarget(p, job).label.toLowerCase()} venter på dig`); }
    else { job.status = 'failed'; setVersionStatus(pid, job, 'failed'); }
    render();
  }, 500 + ms);
}
function setVersionStatus(pid, job, st) {
  const p = S.projects[pid]; if (!p) return;
  if (job.target.type === 'asset') {
    const a = p.assets[job.target.id]; const v = a.versions.find((x) => x.v === job.target.n);
    if (v) { v.status = st; if (st === 'needs_approval') for (const [r] of REF_ROLES[a.kind].slice(0, a.kind === 'character' ? 4 : 3)) if (!v.refs[r]) v.refs[r] = { src: 'gen' }; }
    return;
  }
  const s = p.shots[job.target.id]; const v = s[job.target.slot].versions.find((x) => x.n === job.target.n);
  if (v) v.status = st;
}
function startGen(p, slot, shotId) {
  const s = p.shots[shotId];
  const n = s[slot].versions.length + 1;
  const provider = PROVIDERS[slot === 'frame' ? 'image' : 'video'][0];
  s[slot].versions.push(mkVersion(n, 'generating', { provider }));
  const job = { id: nextId('job'), target: { type: 'shot', id: shotId, slot, n }, status: 'queued', provider, cost: PRICE[slot], at: 'lige nu', attempts: [{ provider, result: 'ok' }] };
  p.jobs.push(job);
  if (slot === 'frame') S.frameSel = null; else S.videoSel = null;
  runJob(p.id, job, slot === 'frame' ? 2200 + Math.random() * 1200 : 3600 + Math.random() * 1500);
}

/* =====================================================================
   Handlinger
   ===================================================================== */
const ACT = {
  home() { S.pid = null; S.view = 'projects'; },
  reset() { try { localStorage.removeItem(STORE_KEY); } catch (e) { /* ingen lagring */ } S = freshState(); resumeDemo(); toast('Demoen er startet forfra.'); },
  newProject() { S.pid = null; S.view = 'new'; S.draftIdea = { ...SANDER_IDEA, title: 'Sander bliver afbrudt — ny version', pid: null }; },
  openProject(d) { S.pid = d.id; S.view = 'overview'; S.draftIdea = null; },
  nav(d) { if (!d.view) return; S.view = d.view; if (d.view !== 'asset') S.assetV = null; },
  sbMode(d) { S.sbMode = d.mode; },
  assetTab(d) { S.assetTab = d.tab; },
  assetFilter(d) { S.assetFilter = d.f; },
  openShot(d) { S.view = 'shot'; S.shotId = d.id; S.frameSel = null; S.videoSel = null; S.playing = null; },
  openAsset(d) { S.view = 'asset'; S.assetId = d.id; S.assetV = null; },
  selAssetV(d) { S.assetV = { id: d.id, v: Number(d.v) }; },
  selFrame(d) { S.frameSel = { id: d.id, n: Number(d.n) }; },
  selVideo(d) { S.videoSel = { id: d.id, n: Number(d.n) }; },
  play(d) { S.playing = d.id; const s = P().shots[d.id]; setTimeout(() => { if (S.playing === d.id) { S.playing = null; render(); } }, s.duration * 1000 + 200); },

  createProject() {
    const d = S.draftIdea; if (!d.title.trim() || !d.idea.trim()) { toast('Giv filmen en titel og en idé.'); return; }
    const p = buildEmptyProject({ title: d.title.trim(), idea: d.idea, message: d.message, audience: d.audience, feeling: d.feeling, duration: Number(d.duration) || 60, style: d.style });
    S.projects[p.id] = p; S.order.unshift(p.id); S.pid = p.id; S.view = 'brief'; S.draftIdea = null;
    genBrief(p);
  },
  generateBrief() {
    const p = P(); const d = S.draftIdea;
    p.idea = { title: d.title, idea: d.idea, message: d.message, audience: d.audience, feeling: d.feeling, duration: Number(d.duration) || 60, style: d.style };
    p.title = d.title; S.view = 'brief'; genBrief(p);
  },
  approveBrief() { const p = P(); p.brief.status = 'approved'; toast('Briefet er godkendt. Nu kan storyboardet laves.'); },
  rejectBrief() { const p = P(); p.brief.status = 'rejected'; p.ideaStatus = 'draft'; S.view = 'idea'; toast('Briefet er afvist. Ret idéen, og foreslå et nyt.'); },
  generateStoryboard() {
    const p = P(); p.storyboard.status = 'generating'; p.storyboard.version += 1;
    setTimeout(() => {
      const sp = S.projects[p.id]; if (!sp) return;
      sp.scenes = SCENES.map((s) => ({ ...s }));
      sp.shots = {}; for (const s of shotTemplates()) sp.shots[s.id] = s;
      sp.assets = {}; for (const t of assetTemplates()) sp.assets[t.id] = assetFromTemplate(t, 'draft');
      const c = Math.round((sp.idea.duration || 60) / 60 * 100) / 100; if (c !== 1) for (const s of Object.values(sp.shots)) s.duration = Math.max(1, Math.round(s.duration * c));
      sp.storyboard.status = 'needs_approval';
      toast('Storyboard og 9 aktiver er foreslået. De venter på dig.'); render();
    }, 2600);
  },
  approveStoryboard() { P().storyboard.status = 'approved'; toast('Storyboardet er godkendt. Godkend karakterer og locations, så shots kan produceres.'); },
  rejectStoryboard() { const p = P(); p.storyboard.status = 'draft'; p.shots = {}; p.scenes = []; p.assets = {}; toast('Storyboardet er afvist. Lad instruktøren foreslå et nyt.'); },

  newAsset(d) {
    const p = P(); const kind = d.kind; const n = Object.values(p.assets).filter((a) => a.kind === kind).length + 1;
    const id = nextId('a');
    const attrs = kind === 'character' ? { 'Alder': '', 'Hår': '', 'Overdel': '', 'Kendetegn': '' } : kind === 'location' ? { 'Arkitektur': '', 'Tid på dagen': '', 'Lys': '', 'Vejr': '', 'Farvepalet': '' } : { 'Udseende': '' };
    p.assets[id] = { id, code: `${KIND[kind].code}_NY${n}_01`, kind, name: `Ny ${KIND[kind].label.toLowerCase()} ${n}`, role: 'Tilføjet manuelt', look: kind === 'character' ? 'per' : kind === 'location' ? 'villavej' : 'phone', rules: [], consent: kind === 'character' ? false : null, master: null, versions: [{ v: 1, status: 'draft', attrs, note: '', refs: {} }] };
    S.view = 'asset'; S.assetId = id; S.assetV = null; toast('Oprettet som kladde. Udfyld identiteten, og generér master-referencer.');
  },
  consent(d) { P().assets[d.id].consent = true; toast('Samtykke registreret.'); },
  genMaster(d) {
    const p = P(); const a = p.assets[d.id]; const v = Number(d.v);
    openSheet({ title: `Generér master-referencer for ${a.name}`, sub: `${KIND[a.kind].label} ${a.code} v${v}. Referencerne bliver den officielle identitet, som alle shots bruger.`, cost: PRICE.master,
      lines: [['Provider', 'Billedmodel B (bedst til referenceark)'], ['Billeder', `${REF_ROLES[a.kind].length - (a.kind === 'character' ? 1 : 0)} vinkler`], ['Pris', `ca. ${kr(PRICE.master)}`]],
      run: () => { const ver = a.versions.find((x) => x.v === v); ver.status = 'generating'; const job = { id: nextId('job'), target: { type: 'asset', id: a.id, slot: 'master', n: v }, status: 'queued', provider: 'Billedmodel B', cost: PRICE.master, at: 'lige nu', attempts: [{ provider: 'Billedmodel B', result: 'ok' }] }; p.jobs.push(job); runJob(p.id, job, 2400); } });
  },
  approveAsset(d) {
    const p = P(); const a = p.assets[d.id]; const v = a.versions.find((x) => x.v === Number(d.v));
    v.status = 'approved';
    if (!a.master) { a.master = v.v; toast(`${a.name} v${v.v} er godkendt og er nu master.`); }
    else toast(`${a.name} v${v.v} er godkendt. Gør den til master, når du er klar.`);
  },
  rejectAsset(d) { const a = P().assets[d.id]; a.versions.find((x) => x.v === Number(d.v)).status = 'rejected'; toast(`${a.name} v${d.v} er afvist. Ret identiteten, og generér igen.`); },
  makeMaster(d) {
    const p = P(); const a = p.assets[d.id]; a.master = Number(d.v);
    const hit = usage(p, a).filter((s) => s.assets.some((r) => r.id === a.id && r.v < a.master && !r.pinned));
    toast(hit.length ? `${a.name} v${a.master} er master. ${hit.length} shots er nu markeret som forældede.` : `${a.name} v${a.master} er master.`);
  },
  newVersion(d) {
    const a = P().assets[d.id]; const base = assetMasterV(a) || assetLatest(a);
    a.versions.push({ v: assetLatest(a).v + 1, status: 'draft', attrs: { ...base.attrs }, note: 'Ret identiteten herunder', refs: {} });
    S.assetV = null; toast(`v${assetLatest(a).v} er oprettet som kladde. Den gamle master er uændret.`);
  },

  gen(d) {
    const p = P(); const s = p.shots[d.id]; const slot = d.slot;
    const gates = slot === 'frame' ? frameGates(p, s) : videoGates(p, s);
    if (!gatesOk(gates)) { toast('Shottet mangler noget, før det kan genereres.'); return; }
    const provider = PROVIDERS[slot === 'frame' ? 'image' : 'video'];
    openSheet({ title: `Generér ${slot === 'frame' ? 'startframe' : 'video'} for ${s.code}`, sub: slot === 'frame' ? 'Bygges ud fra shottets spec og de godkendte aktivers referencebilleder.' : `Image-to-video ud fra den godkendte startframe · ${s.duration} sek. · ${MOVES[s.camera.move].toLowerCase()}.`, cost: PRICE[slot],
      lines: [['Provider', `${provider[0]} (reserve: ${provider[1]})`], ['Evne', slot === 'frame' ? 'text-to-image med referencer' : 'image-to-video'], ['Pris', `ca. ${kr(PRICE[slot])}`]],
      run: () => startGen(p, slot, s.id) });
  },
  batchFrames() {
    const p = P(); const ready = Object.values(p.shots).filter((s) => frameStatus(p, s) === 'draft' && gatesOk(frameGates(p, s)));
    if (!ready.length) return;
    openSheet({ title: `Generér ${ready.length} startframes`, sub: `${ready.map((s) => s.code).join(', ')}. Én godkendelse dækker hele batchen — hver frame skal stadig godkendes bagefter.`, cost: ready.length * PRICE.frame,
      lines: [['Provider', 'Billedmodel A (reserve: Billedmodel B)'], ['Antal', `${ready.length} × ${kr(PRICE.frame)}`], ['I alt', `ca. ${kr(ready.length * PRICE.frame)}`]],
      run: () => ready.forEach((s, i) => setTimeout(() => { startGen(p, 'frame', s.id); render(); }, i * 350)) });
  },
  approveSlot(d) {
    const p = P(); const s = p.shots[d.id]; const v = s[d.slot].versions.find((x) => x.n === Number(d.n));
    v.status = 'approved'; s[d.slot].approved = v.n;
    toast(d.slot === 'frame' ? `${s.code}: startframe godkendt. Video kan nu genereres.` : `${s.code}: video godkendt.`);
  },
  rejectSlot(d) { const p = P(); const s = p.shots[d.id]; const v = s[d.slot].versions.find((x) => x.n === Number(d.n)); v.status = 'rejected'; v.comment = 'Afvist i prototypen'; toast(`${s.code}: v${v.n} er afvist. Generér en ny version.`); },
  approveAllFrames() { const p = P(); let n = 0; for (const s of Object.values(p.shots)) if (frameStatus(p, s) === 'needs_approval') { const v = latest(s.frame); v.status = 'approved'; s.frame.approved = v.n; n++; } toast(`${n} startframes er godkendt.`); },
  retryJob(d) {
    const p = P(); const j = p.jobs.find((x) => x.id === d.job); const s = p.shots[j.target.id];
    const n = s[j.target.slot].versions.length + 1;
    const doIt = () => {
      s[j.target.slot].versions.push(mkVersion(n, 'generating', { provider: 'Videomodel B' }));
      const job = { id: nextId('job'), target: { ...j.target, n }, status: 'queued', provider: 'Videomodel B', cost: j.cost, at: 'lige nu', attempts: [{ provider: 'Videomodel B', result: 'ok' }] };
      p.jobs.push(job); runJob(p.id, job, 3800);
    };
    openSheet({ title: `Prøv igen: ${s.code}`, sub: 'Det fejlede job er bekræftet stoppet og ikke betalt. Et nyt forsøg er en ny generering.', cost: j.cost, lines: [['Provider', 'Videomodel B'], ['Pris', `ca. ${kr(j.cost)}`]], run: doIt });
  },
  updateRef(d) {
    const p = P(); const s = p.shots[d.id]; const r = s.assets.find((x) => x.id === d.aid); const a = p.assets[d.aid];
    const old = r.v; r.v = a.master; r.pinned = false;
    // Godkendte versioner bevares i historikken, men markeres som forældede.
    for (const slot of ['frame', 'video']) {
      for (const v of s[slot].versions) if (v.status === 'approved' || v.status === 'needs_approval') { v.status = 'outdated'; v.comment = `Bygget på ${a.name} v${old}`; }
      s[slot].approved = null;
    }
    toast(`${s.code} bruger nu ${a.name} v${a.master}. Generér en ny startframe.`);
  },
  pinRef(d) { const p = P(); const s = p.shots[d.id]; const r = s.assets.find((x) => x.id === d.aid); r.pinned = true; toast(`${s.code} beholder bevidst ${p.assets[d.aid].name} v${r.v}.`); },
  fixConflict(d) {
    const p = P(); const s = p.shots[d.id]; const c = openConflicts(p, s).find((x) => x.assetId === d.aid && x.attr === d.attr); if (!c) return;
    s.notes = s.notes.replace(c.match.trim(), c.master); s.action = s.action.replace(c.match.trim(), c.master);
    toast(`Rettet: "${c.shot}" er erstattet med "${c.master}".`);
  },
  allowDeviation(d) {
    const p = P(); const s = p.shots[d.id]; const c = openConflicts(p, s).find((x) => x.assetId === d.aid && x.attr === d.attr); if (!c) return;
    s.deviations.push({ assetId: d.aid, attr: d.attr, value: c.shot, reason: 'Tilladt i Shot Editor' });
    toast(`Afvigelsen er tilladt for ${s.code} og gemt med shottet.`);
  },
  checkSpec(d) { const p = P(); const s = p.shots[d.id]; const n = openConflicts(p, s).length; toast(n ? `${n} kontinuitetskonflikt fundet.` : 'Ingen konflikter. Shottet matcher alle aktiver.'); },

  confirmSheet() { const sh = S.sheet; S.sheet = null; if (sh && sh.run) sh.run(); },
  closeSheet(d, el, ev) { if (ev && ev.target.closest('[data-stop]') && !ev.target.closest('[data-act="closeSheet"]:not(.scrim)')) return; S.sheet = null; },
};
function openSheet(sh) { S.sheet = sh; }
function genBrief(p) {
  p.brief.status = 'generating'; p.ideaStatus = 'approved';
  setTimeout(() => {
    const sp = S.projects[p.id]; if (!sp) return;
    sp.brief.version += 1;
    sp.brief.content = { ...SANDER_BRIEF, message: sp.idea.message || SANDER_BRIEF.message, audience: sp.idea.audience || SANDER_BRIEF.audience, feeling: sp.idea.feeling || SANDER_BRIEF.feeling, duration: Number(sp.idea.duration) || 60, style: sp.idea.style || SANDER_BRIEF.style };
    sp.brief.status = 'needs_approval';
    toast(`Film Brief v${sp.brief.version} er klar og venter på dig.`); render();
  }, 2400);
}

/* Genoptag simulerede jobs, der stod som "genererer", da siden blev åbnet. */
function resumeDemo() {
  for (const p of Object.values(S.projects)) for (const j of p.jobs) if (j.status === 'generating' || j.status === 'queued') runJob(p.id, j, 3000 + Math.random() * 2500);
  for (const p of Object.values(S.projects)) {
    if (p.brief.status === 'generating') genBrief(p);
    if (p.storyboard.status === 'generating') { p.storyboard.status = 'draft'; p.storyboard.version = Math.max(0, p.storyboard.version - 1); }
    for (const a of Object.values(p.assets)) for (const v of a.versions) if (v.status === 'generating' && !p.jobs.some((j) => j.target.type === 'asset' && j.target.id === a.id && j.target.n === v.v && (j.status === 'generating' || j.status === 'queued'))) v.status = 'draft';
  }
}

/* =====================================================================
   Hændelser
   ===================================================================== */
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  if (el.classList.contains('scrim') && ev.target !== el) return;
  ev.preventDefault();
  const fn = ACT[el.dataset.act];
  if (fn) { fn({ ...el.dataset }, el, ev); render(); if (['nav', 'openShot', 'openAsset', 'openProject', 'newProject', 'home'].includes(el.dataset.act)) window.scrollTo(0, 0); }
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape' && S.sheet) { S.sheet = null; render(); }
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('.shotcard[data-act]')) { ev.preventDefault(); ev.target.click(); }
});
document.addEventListener('submit', (ev) => {
  ev.preventDefault();
  const act = ev.target.dataset.form; if (ACT[act]) { ACT[act](); render(); window.scrollTo(0, 0); }
});
document.addEventListener('input', (ev) => {
  const t = ev.target;
  if (t.dataset.bind && S.draftIdea) { S.draftIdea[t.dataset.bind] = t.value; save(); return; }
  if (t.dataset.attr) { const a = P().assets[t.dataset.aid]; const v = a.versions.find((x) => x.v === Number(t.dataset.v)); v.attrs[t.dataset.attr] = t.value; if (t.dataset.attr === 'Navn') a.name = t.value; save(); return; }
  if (t.dataset.spec) {
    const s = P().shots[t.dataset.id]; const k = t.dataset.spec;
    if (['type', 'move', 'lens'].includes(k)) s.camera[k] = k === 'lens' ? Number(t.value) : t.value;
    else if (k === 'duration') s.duration = Math.max(1, Math.min(15, Number(t.value) || 1));
    else s[k] = t.value;
    save();
  }
});
document.addEventListener('change', (ev) => {
  const t = ev.target;
  if (t.dataset.spec && t.tagName === 'SELECT') render();
  if (t.dataset.upload) {
    const file = t.files && t.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = () => { const a = P().assets[t.dataset.upload]; const v = a.versions.find((x) => x.v === Number(t.dataset.v)); v.refs[t.dataset.role] = { src: 'upload', data: r.result }; toast('Referencen er uploadet.'); render(); };
    r.readAsDataURL(file);
  }
});

resumeDemo();
render();
</script>
