<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>FRAME</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #f3f4f7;
  --surface: #ffffff;
  --surface-2: #f8f9fb;
  --ink: #15171c;
  --muted: #5d6370;
  --faint: #8b91a0;
  --line: #e2e5eb;
  --line-strong: #cfd4dd;
  --accent: #0b5fd1;
  --accent-ink: #ffffff;
  --accent-soft: #e7effc;
  --focus: #0b5fd1;

  --st-draft-bg: #eef0f4;     --st-draft: #4b5260;
  --st-gen-bg: #e5efff;       --st-gen: #0b5fd1;
  --st-need-bg: #fff1d6;      --st-need: #8a4b00;
  --st-ok-bg: #e2f4e8;        --st-ok: #17693b;
  --st-rej-bg: #fde8e7;       --st-rej: #a4221a;
  --st-old-bg: #efe8fd;       --st-old: #5b35b0;
  --st-fail-bg: #fbe3e1;      --st-fail: #b01d12;

  --shadow: 0 1px 2px rgba(20, 24, 33, .06), 0 4px 16px rgba(20, 24, 33, .05);
  --radius: 12px;
  --radius-sm: 8px;
  --sans: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111318; --surface: #1a1d24; --surface-2: #20242c; --ink: #eceef3; --muted: #a3a9b6; --faint: #7d8494;
    --line: #2b3039; --line-strong: #3a404b; --accent: #5b9bff; --accent-ink: #0b1220; --accent-soft: #1b2a44; --focus: #7fb0ff;
    --st-draft-bg: #262a33; --st-draft: #b7bcc8; --st-gen-bg: #172a4a; --st-gen: #8cb8ff; --st-need-bg: #3a2a0f; --st-need: #ffc56b;
    --st-ok-bg: #12301f; --st-ok: #7fd9a1; --st-rej-bg: #3b1715; --st-rej: #ff9a92; --st-old-bg: #2a1f45; --st-old: #c3a8ff;
    --st-fail-bg: #3d1311; --st-fail: #ff8479; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111318; --surface: #1a1d24; --surface-2: #20242c; --ink: #eceef3; --muted: #a3a9b6; --faint: #7d8494;
  --line: #2b3039; --line-strong: #3a404b; --accent: #5b9bff; --accent-ink: #0b1220; --accent-soft: #1b2a44; --focus: #7fb0ff;
  --st-draft-bg: #262a33; --st-draft: #b7bcc8; --st-gen-bg: #172a4a; --st-gen: #8cb8ff; --st-need-bg: #3a2a0f; --st-need: #ffc56b;
  --st-ok-bg: #12301f; --st-ok: #7fd9a1; --st-rej-bg: #3b1715; --st-rej: #ff9a92; --st-old-bg: #2a1f45; --st-old: #c3a8ff;
  --st-fail-bg: #3d1311; --st-fail: #ff8479; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 24px; font-weight: 700; }
h2 { font-size: 17px; font-weight: 650; }
h3 { font-size: 14px; font-weight: 650; }
p { margin: 0; }
.mono { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 12.5px; }
.label { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); font-weight: 600; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 236px 1fr; grid-template-rows: auto 1fr auto; min-height: 100%; }
.topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; cursor: pointer; border: 0; background: none; padding: 0; }
.brand-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--ink); display: grid; place-items: center; }
.brand-mark svg { width: 16px; height: 16px; }
.crumb { color: var(--muted); display: flex; gap: 8px; align-items: center; min-width: 0; }
.crumb strong { color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .spacer { flex: 1; }
.proto-tag { font-size: 11.5px; color: var(--muted); border: 1px dashed var(--line-strong); padding: 3px 8px; border-radius: 6px; white-space: nowrap; }

.sidenav { background: var(--surface); border-right: 1px solid var(--line); padding: 16px 12px; display: flex; flex-direction: column; gap: 18px; }
.navgroup { display: flex; flex-direction: column; gap: 2px; }
.navgroup .label { padding: 0 10px 6px; }
.navitem { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; border: 0; background: none; text-align: left; cursor: pointer; color: var(--ink); width: 100%; }
.navitem:hover { background: var(--surface-2); }
.navitem.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.navitem .step { font-family: var(--mono); font-size: 11px; color: var(--faint); width: 16px; }
.navitem.active .step { color: var(--accent); }
.navitem .grow { flex: 1; }
.navitem .dot { width: 8px; height: 8px; border-radius: 50%; }
.badge { font-size: 11px; font-weight: 600; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; display: inline-grid; place-items: center; background: var(--st-need-bg); color: var(--st-need); }
.badge.gen { background: var(--st-gen-bg); color: var(--st-gen); }

main { padding: 24px clamp(16px, 3vw, 32px) 40px; min-width: 0; }
.statusbar { grid-column: 1 / -1; background: var(--surface); border-top: 1px solid var(--line); padding: 10px 20px calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; position: sticky; bottom: 0; z-index: 20; }
.statusbar b { font-variant-numeric: tabular-nums; }
.statusbar .sep { color: var(--line-strong); }

/* ---------- common ---------- */
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack.tight { gap: 8px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.row.top { align-items: flex-start; }
.grow { flex: 1; min-width: 0; }
.pagehead { display: flex; justify-content: space-between; gap: 16px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 20px; }
.pagehead .sub { color: var(--muted); margin-top: 4px; max-width: 70ch; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.card.pad-lg { padding: 22px; }
.card.flush { padding: 0; overflow: hidden; }
.divider { height: 1px; background: var(--line); }
.cols { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.cols.even { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cols.side { grid-template-columns: 280px minmax(0, 1fr); }

.btn { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; font-weight: 550; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.approve { background: var(--st-ok); border-color: var(--st-ok); color: var(--surface); }
.btn.reject { color: var(--st-rej); }
.btn.ghost { border-color: transparent; background: none; color: var(--accent); padding-inline: 6px; }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.btn .cost { font-family: var(--mono); font-size: 11.5px; opacity: .85; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 9px 3px 7px; border-radius: 999px; white-space: nowrap; line-height: 1.3; }
.pill::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.draft { background: var(--st-draft-bg); color: var(--st-draft); }
.pill.draft::before { background: none; border: 1.5px solid currentColor; width: 5px; height: 5px; }
.pill.generating { background: var(--st-gen-bg); color: var(--st-gen); }
.pill.generating::before { animation: pulse 1s ease-in-out infinite; }
.pill.needs_approval { background: var(--st-need-bg); color: var(--st-need); }
.pill.approved { background: var(--st-ok-bg); color: var(--st-ok); }
.pill.rejected { background: var(--st-rej-bg); color: var(--st-rej); }
.pill.outdated { background: var(--st-old-bg); color: var(--st-old); }
.pill.failed { background: var(--st-fail-bg); color: var(--st-fail); }
.pill.locked { background: transparent; color: var(--faint); border: 1px dashed var(--line-strong); }
.pill.locked::before { display: none; }
.pill.bare { padding: 0; background: none; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .pill.generating::before, .shimmer, .playing img { animation: none !important; } }

.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; padding: 3px 8px 3px 4px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); cursor: pointer; white-space: nowrap; }
.chip:hover { border-color: var(--line-strong); }
.chip .k { font-family: var(--mono); font-size: 10px; font-weight: 500; padding: 1px 4px; border-radius: 4px; background: var(--line); color: var(--muted); }
.chip .v { font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
.chip.stale { border-color: var(--st-old); color: var(--st-old); background: var(--st-old-bg); }
.chip.stale .v { color: var(--st-old); }
.chip.warn { border-color: var(--st-need); background: var(--st-need-bg); color: var(--st-need); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }

.notice { padding: 11px 14px; border-radius: 10px; font-size: 13.5px; display: flex; gap: 10px; align-items: flex-start; }
.notice.info { background: var(--accent-soft); color: var(--ink); }
.notice.warn { background: var(--st-need-bg); color: var(--st-need); }
.notice.old { background: var(--st-old-bg); color: var(--st-old); }
.notice.fail { background: var(--st-fail-bg); color: var(--st-fail); }
.notice.ok { background: var(--st-ok-bg); color: var(--st-ok); }
.notice .grow p + p { margin-top: 4px; }

label.field { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 600; }
label.field .hint { font-weight: 400; color: var(--muted); font-size: 12px; }
input[type=text], input[type=number], textarea, select { background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 10px; width: 100%; font-weight: 400; }
textarea { resize: vertical; }
.formgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.formgrid .full { grid-column: 1 / -1; }

dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: 7px 18px; margin: 0; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; }

/* ---------- journey ---------- */
.journey { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 0; overflow-x: auto; }
.jstep { position: relative; padding: 14px 10px 12px; border-right: 1px solid var(--line); cursor: pointer; background: none; border-top: 0; border-bottom: 0; border-left: 0; text-align: left; display: flex; flex-direction: column; gap: 8px; min-width: 104px; }
.jstep:last-child { border-right: 0; }
.jstep:hover { background: var(--surface-2); }
.jstep .n { font-family: var(--mono); font-size: 11px; color: var(--faint); }
.jstep .t { font-weight: 650; font-size: 13px; line-height: 1.2; }
.jstep .c { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.jstep .bar { position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--line); }
.jstep .bar.approved { background: var(--st-ok); } .jstep .bar.needs_approval { background: var(--st-need); } .jstep .bar.generating { background: var(--st-gen); }
.jstep .bar.failed { background: var(--st-fail); } .jstep .bar.outdated { background: var(--st-old); } .jstep .bar.rejected { background: var(--st-rej); }

/* ---------- frames ---------- */
.frame { position: relative; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; background: var(--surface-2); border: 1px solid var(--line); max-width: 100%; }
.frame svg, .frame img { width: 100%; height: 100%; display: block; object-fit: cover; }
.frame .empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--faint); font-size: 12px; border: 1.5px dashed var(--line-strong); border-radius: 8px; padding: 8px; }
.frame .over { position: absolute; left: 6px; bottom: 6px; display: flex; gap: 4px; }
.frame .tc { position: absolute; right: 6px; bottom: 6px; font-family: var(--mono); font-size: 10.5px; color: #fff; background: rgba(0,0,0,.55); padding: 1px 5px; border-radius: 4px; }
.frame.dim svg { opacity: .45; filter: grayscale(.6); }
.shimmer { position: absolute; inset: 0; background: linear-gradient(100deg, transparent 20%, rgba(11,95,209,.14) 45%, transparent 70%) var(--st-gen-bg); background-size: 220% 100%; animation: shim 1.3s linear infinite; display: grid; place-items: center; color: var(--st-gen); font-weight: 600; font-size: 12px; }
@keyframes shim { to { background-position: -120% 0; } }
.playbtn { position: absolute; inset: 0; margin: auto; width: 42px; height: 42px; border-radius: 50%; border: 0; background: rgba(0,0,0,.55); cursor: pointer; display: grid; place-items: center; }
.playbtn svg { width: 16px; height: 16px; }
.playing svg.scene { animation-duration: var(--dur, 5s); animation-timing-function: linear; animation-fill-mode: forwards; }
.playing.m-optical_zoom svg.scene { animation-name: zoomIn; transform-origin: 50% 40%; }
.playing.m-pan svg.scene { animation-name: panR; }
.playing.m-handheld svg.scene { animation-name: shake; animation-timing-function: ease-in-out; }
.playing.m-static svg.scene, .playing.m-dolly svg.scene { animation-name: drift; }
@keyframes zoomIn { to { transform: scale(1.35); } }
@keyframes panR { from { transform: scale(1.15) translateX(5%); } to { transform: scale(1.15) translateX(-5%); } }
@keyframes shake { 0%,100% { transform: scale(1.06) translate(0,0) } 25% { transform: scale(1.06) translate(-1%,.6%) } 50% { transform: scale(1.06) translate(.8%,-.5%) } 75% { transform: scale(1.06) translate(-.4%,.8%) } }
@keyframes drift { to { transform: scale(1.04); } }

/* ---------- storyboard ---------- */
.scene-block { display: flex; flex-direction: column; gap: 12px; }
.scene-head { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.scene-head .code { font-family: var(--mono); font-size: 12px; color: var(--faint); }
.shotgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.shotcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; display: flex; flex-direction: column; gap: 9px; cursor: pointer; text-align: left; }
.shotcard:hover { border-color: var(--line-strong); box-shadow: var(--shadow); }
.shotcard.is-old { border-color: var(--st-old); }
.shotcard.is-warn { border-color: var(--st-need); }
.shotcard .meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.shotcode { font-family: var(--mono); font-weight: 500; font-size: 12.5px; }
.shotcard .action { font-size: 13px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.7em; }
.slotrow { display: grid; grid-template-columns: auto 1fr; gap: 5px 8px; align-items: center; font-size: 12px; }
.slotrow .k { color: var(--muted); }

.tablewrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th { text-align: left; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--faint); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.data td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.data tr:last-child td { border-bottom: 0; }
table.data tr.click { cursor: pointer; }
table.data tr.click:hover td { background: var(--surface-2); }
table.data .thumb { width: 84px; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; cursor: pointer; font-weight: 550; }
.seg button.on { background: var(--ink); color: var(--surface); }

/* ---------- assets ---------- */
.assetlist { display: flex; flex-direction: column; gap: 6px; }
.assetrow { display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 10px; border: 1px solid transparent; cursor: pointer; background: none; width: 100%; text-align: left; }
.assetrow:hover { background: var(--surface); border-color: var(--line); }
.assetrow.on { background: var(--surface); border-color: var(--accent); }
.avatar { width: 44px; height: 44px; border-radius: 10px; overflow: hidden; flex: none; background: var(--surface-2); border: 1px solid var(--line); }
.avatar svg, .avatar img { width: 100%; height: 100%; display: block; object-fit: cover; }
.refgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
.refslot { display: flex; flex-direction: column; gap: 6px; }
.refslot .frame { aspect-ratio: 4 / 5; }
.refslot.wide .frame { aspect-ratio: 16 / 9; }
.refslot .cap { display: flex; justify-content: space-between; font-size: 12px; gap: 6px; }
.uploadbtn { position: absolute; inset: 0; display: grid; place-items: center; cursor: pointer; color: var(--accent); font-size: 12px; font-weight: 600; text-align: center; border: 1.5px dashed var(--line-strong); border-radius: 8px; background: var(--surface-2); }
.uploadbtn input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.attrtable { display: grid; grid-template-columns: max-content 1fr; gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.attrtable > div { padding: 8px 12px; border-bottom: 1px solid var(--line); }
.attrtable > div:nth-last-child(-n+2) { border-bottom: 0; }
.attrtable .k { color: var(--muted); background: var(--surface-2); border-right: 1px solid var(--line); }
.attrtable input { padding: 4px 8px; }
.versions { display: flex; gap: 6px; flex-wrap: wrap; }
.vtab { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 5px 10px; cursor: pointer; display: inline-flex; gap: 7px; align-items: center; font-size: 12.5px; }
.vtab.on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.vtab .star { color: var(--st-ok); font-size: 11px; font-weight: 700; }

/* ---------- shot editor ---------- */
.editor { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.section-title { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.prompt { font-family: var(--mono); font-size: 12px; line-height: 1.6; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px; white-space: pre-wrap; color: var(--muted); }
.prompt mark { background: var(--st-need-bg); color: var(--st-need); border-radius: 3px; padding: 0 2px; }
.prompt b { color: var(--ink); font-weight: 500; }
.contlist { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.controw { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); align-items: center; font-size: 13px; }
.controw:last-child { border-bottom: 0; }
.controw.conflict { background: var(--st-need-bg); }
.controw .res { font-weight: 600; font-size: 12px; }
.res.match { color: var(--st-ok); } .res.conflict { color: var(--st-need); } .res.dev { color: var(--st-old); }
.versionstrip { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.vcard { display: flex; flex-direction: column; gap: 5px; border: 0; background: none; padding: 0; text-align: left; cursor: pointer; }
.vcard .frame { border-width: 2px; }
.vcard.on .frame { border-color: var(--accent); }
.gate { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--muted); }
.gate .ic { width: 16px; flex: none; text-align: center; font-weight: 700; }
.gate.ok .ic { color: var(--st-ok); } .gate.no .ic { color: var(--st-rej); }

/* ---------- approvals / queue ---------- */
.approvalitem { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px; border-bottom: 1px solid var(--line); }

.job { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 7px; font-size: 12.5px; }
.job .attempts { border-left: 2px solid var(--line-strong); padding-left: 8px; display: flex; flex-direction: column; gap: 3px; color: var(--muted); font-size: 12px; }
.job .attempts .bad { color: var(--st-fail); }

/* ---------- sheet / toast ---------- */
.scrim { position: fixed; inset: 0; background: rgba(15,17,22,.35); z-index: 50; display: grid; place-items: end center; padding: 16px; }
.sheet { background: var(--surface); border-radius: 16px; width: min(520px, 100%); padding: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.25); display: flex; flex-direction: column; gap: 14px; margin-bottom: max(16px, env(safe-area-inset-bottom, 0px)); }
.sheet .costline { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; padding: 6px 0; border-bottom: 1px solid var(--line); }
.sheet .costline:last-of-type { border-bottom: 0; }
.budget { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; display: flex; }
.budget i { display: block; height: 100%; }
.toasts { position: fixed; right: 16px; bottom: 64px; display: flex; flex-direction: column; gap: 8px; z-index: 60; max-width: min(380px, calc(100% - 32px)); }
.toast { background: var(--ink); color: var(--surface); padding: 10px 14px; border-radius: 10px; font-size: 13px; box-shadow: var(--shadow); }

.projcard { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 18px; cursor: pointer; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.projcard:hover { box-shadow: var(--shadow); border-color: var(--line-strong); }
.minijourney { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
.minijourney i { height: 6px; border-radius: 3px; background: var(--line); }
.minijourney i.approved { background: var(--st-ok); } .minijourney i.needs_approval { background: var(--st-need); } .minijourney i.generating { background: var(--st-gen); }

.legend { display: flex; gap: 8px; flex-wrap: wrap; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.kpi b { font-size: 22px; font-variant-numeric: tabular-nums; display: block; }

@media (max-width: 1100px) {

}
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidenav { flex-direction: row; overflow-x: auto; padding: 8px 12px; border-right: 0; border-bottom: 1px solid var(--line); gap: 10px; }
  .navgroup { flex-direction: row; gap: 2px; }
  .navgroup .label { display: none; }
  .navitem { width: auto; white-space: nowrap; }
  .proto-tag { display: none; }
  .projcard { grid-template-columns: minmax(0, 1fr); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .formgrid { grid-template-columns: minmax(0, 1fr); }
  .approvalitem { grid-template-columns: 96px minmax(0, 1fr); }
  .approvalitem .frame { width: 96px; }
  .approvalitem .acts { grid-column: 1 / -1; }
}


/* ---------- iteration 2: storyboard først ---------- */
.filmhead { display: flex; flex-direction: column; gap: 14px; margin-bottom: 22px; }

.filmtc { font-family: var(--mono); font-size: 22px; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.filmtc span { color: var(--faint); }
.timeline { display: flex; height: 30px; border-radius: 8px; overflow: hidden; gap: 2px; background: var(--line); border: 1px solid var(--line); }
.timeline button { border: 0; padding: 0 6px; cursor: pointer; font-family: var(--mono); font-size: 10.5px; color: var(--st-draft); background: var(--st-draft-bg); display: flex; align-items: center; min-width: 0; overflow: hidden; white-space: nowrap; }
.timeline i { display: block; background: var(--st-draft-bg); }
.timeline button:hover { filter: brightness(.96); }
.timeline .approved { background: var(--st-ok-bg); color: var(--st-ok); }
.timeline .needs_approval { background: var(--st-need-bg); color: var(--st-need); }
.timeline .generating { background: var(--st-gen-bg); color: var(--st-gen); }
.timeline .failed { background: var(--st-fail-bg); color: var(--st-fail); }
.timeline .outdated { background: var(--st-old-bg); color: var(--st-old); }
.timeline .rejected { background: var(--st-rej-bg); color: var(--st-rej); }
.tl-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }

.strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 18px 14px; }
.sframe { display: flex; flex-direction: column; gap: 7px; cursor: pointer; border: 0; background: none; padding: 0; text-align: left; color: inherit; }
.sframe .frame { border-width: 1px; transition: transform .12s ease, box-shadow .12s ease; }
.sframe:hover .frame { transform: translateY(-2px); box-shadow: var(--shadow); }
.sframe.is-old .frame { outline: 2px solid var(--st-old); outline-offset: 1px; }
.sframe.is-warn .frame { outline: 2px solid var(--st-need); outline-offset: 1px; }
.sframe .cap1 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sframe .cap1 .shotcode { font-size: 12px; }
.sframe .cap1 .tcs { font-family: var(--mono); font-size: 11px; color: var(--faint); white-space: nowrap; }
.sframe .say { font-size: 13px; line-height: 1.35; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.faces { display: flex; }

.player .missing { position: absolute; left: 10px; top: 10px; background: rgba(0,0,0,.6); color: #ffd08a; font-size: 12px; padding: 3px 8px; border-radius: 6px; }

@media (max-width: 1100px) { .control { grid-template-columns: minmax(0, 1fr); } .totalbox { position: static; } }

function storyboardFor(n, seconds) {
  const all = shotTemplates();
  const keep = new Set(SHOT_PRIORITY.slice(0, Math.max(4, Math.min(12, n))));
  const picked = all.filter((s) => keep.has(s.code));
  const sum = picked.reduce((a, s) => a + s.duration, 0);
  let acc = 0;
  picked.forEach((s, i) => {
    s.duration = i === picked.length - 1 ? Math.max(2, seconds - acc) : Math.max(2, Math.round((s.duration / sum) * seconds));
    acc += s.duration;
    s.code = 'SHOT_' + String(i + 1).padStart(2, '0');
    s.id = 's_' + String(i + 1).padStart(2, '0');
  });
  const shots = {}; for (const s of picked) shots[s.id] = s;
  const scenes = SCENES.filter((sc) => picked.some((s) => s.scene === sc.id)).map((sc, i) => ({ ...sc, n: i + 1 }));
  return { shots, scenes };
}

  return `<svg class="scene" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${esc(s.code)}">${g}</svg>`;
}
function assetSVG(a, role, seed = 1, v = 1) {
  const look = a.look;
  if (a.kind === 'character') {
    const ratio = '0 0 200 250';
    const bgc = role === 'clothing' ? '#e6e8ec' : '#eceef1';
    let g = `<rect width="200" height="250" fill="${bgc}"/>`;
    if (role === 'full_body') g += figure(look, 100, 236, 210);
    else if (role === 'clothing') g += figure(look, 100, 330, 330);
    else if (role === 'profile') g += `<g transform="translate(200 0) scale(-1 1)">${figure(look, 112, 470, 470)}</g>`;
    else g += figure(look, 100, 470, 470);
    return `<svg viewBox="${ratio}" preserveAspectRatio="xMidYMid slice">${g}</svg>`;
  }
  if (a.kind === 'vehicle') {
    let g = `<rect width="320" height="180" fill="#e3e6ea"/><rect y="140" width="320" height="40" fill="#b9bcc1"/>`;
    g += role === 'logo' ? van(-60, 20, 380, v >= 2, logoOf(a, v)) : van(40 + (seed % 3) * 4, 60, 240, v >= 2, logoOf(a, v));
    return `<svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice">${g}</svg>`;
  }
  if (a.kind === 'prop') return `<svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice"><rect width="320" height="180" fill="#dfe2e7"/><g transform="${role === 'detail' ? 'translate(-160 -60) scale(2)' : ''}">${propArt(look)}</g></svg>`;
  return `<svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice">${bg(look, seed + (role === 'detail' ? 2 : 0), role === 'light' ? 1 : 0)}</svg>`;
}

</script>
<script>
'use strict';

/* =====================================================================
   Små byggeklodser
   ===================================================================== */
function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }
const pill = (st, text) => `<span class="pill ${st}">${esc(text || ST[st] || st)}</span>`;
const kr = (n) => `${Math.round(n).toLocaleString('da-DK')} kr.`;
const tc = (sec) => `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(Math.round(sec % 60)).padStart(2, '0')}`;

function frameBox(p, s, which = 'frame', n = null, opts = {}) {
  const slot = s[which];
  const v = n ? slot.versions.find((x) => x.n === n) : (slot.approved ? slot.versions.find((x) => x.n === slot.approved) : latest(slot));
  let inner = '';
  if (!v) inner = `<div class="empty">${which === 'frame' ? 'Ingen startframe endnu' : 'Ingen video endnu'}</div>`;
  else if (v.status === 'generating') inner = `<div class="shimmer">Genererer …</div>`;
  else if (v.status === 'failed') inner = sceneSVG(p, s, v.seed) + `<div class="shimmer" style="background:var(--st-fail-bg);color:var(--st-fail);animation:none">Fejlet</div>`;
  else {
    const dev = s.deviations.find((d) => d.type === 'attr' && d.attr === 'Hovedbeklædning');
    inner = sceneSVG(p, s, v.seed, { capOverride: dev ? '#2f5fae' : null });
    if (which === 'video' && !opts.noPlay) inner += `<button class="playbtn" data-act="play" data-id="${s.id}" aria-label="Afspil ${esc(s.code)}"><svg viewBox="0 0 16 16"><path d="M4 2 L14 8 L4 14 Z" fill="#fff"/></svg></button>`;
  }
  const playing = (S.playing === s.id && which === 'video') || opts.forcePlay;
  const dim = v && v.status === 'rejected' && !opts.noDim;
  return `<div class="frame ${dim ? 'dim' : ''} ${playing ? 'playing m-' + s.camera.move : ''}" style="--dur:${s.duration}s">${inner}${opts.tc === false ? '' : `<span class="tc">${which === 'video' ? '▶ ' : ''}${tc(s.duration)}</span>`}${opts.over ? `<div class="over">${opts.over}</div>` : ''}</div>`;
}
function avatarSVG(a) {
  const mv = assetMasterV(a) || assetLatest(a);
  const role = REF_ROLES[a.kind][0][0];
  const ref = mv.refs[role];
  if (ref && ref.src === 'upload') return `<img alt="" src="${ref.data}">`;
  if (!ref) return '';
  return assetSVG(a, role, 1, mv.v);
}
function avatar(a) {
  const inner = avatarSVG(a);
  return `<div class="avatar">${inner || `<div style="display:grid;place-items:center;height:100%;color:var(--faint);font-family:var(--mono);font-size:10px">${KIND[a.kind].code}</div>`}</div>`;
}
function faces(p, s) {
  return `<span class="faces">${s.assets.map((r) => { const a = p.assets[r.id]; if (!a) return ''; const old = a.master && r.v < a.master && !r.pinned; return `<span class="${old ? 'old' : !a.master ? 'wait' : ''}" title="${esc(a.name)} v${r.v}${old ? ' — forældet' : !a.master ? ' — ikke godkendt' : ''}">${avatarSVG(a)}</span>`; }).join('')}</span>`;
}
function chip(p, r) {
  const a = p.assets[r.id]; if (!a) return '';
  const stale = a.master && r.v < a.master && !r.pinned;
  return `<button class="chip ${stale ? 'stale' : !a.master ? 'warn' : ''}" data-act="openAsset" data-id="${a.id}"><span class="k">${KIND[a.kind].code}</span>${esc(a.name)}<span class="v">v${r.v}${r.pinned ? ' · fastholdt' : ''}</span></button>`;
}
const gateList = (g) => `<div class="stack tight">${g.map((x) => `<div class="gate ${x.ok ? 'ok' : 'no'}"><span class="ic">${x.ok ? '✓' : '×'}</span><span>${esc(x.text)}</span></div>`).join('')}</div>`;

/* =====================================================================
   Ramme: topbar, navigation, statuslinje
   ===================================================================== */
const NAV = [
  ['storyboard', 'Storyboard'],
  ['brief', 'Brief og Film DNA'],
  ['characters', 'Karakterer'],
  ['world', 'Locations og aktiver'],
  ['production', 'Produktion'],
];
function navActive(v) {
  if (S.view === v) return true;
  if (S.view === 'shot') return v === 'storyboard';
  if (S.view === 'asset') { const a = P().assets[S.assetId]; return a && (a.kind === 'character' ? v === 'characters' : v === 'world'); }
  return false;
}
function render() {
  const active = document.activeElement;
  const keep = active && active.id ? { id: active.id, s: active.selectionStart, e: active.selectionEnd } : null;
  const p = S.pid ? P() : null;
  let body = '';
  try { body = p ? projectView(p) : S.view === 'new' ? viewNew() : viewProjects(); }
  catch (err) { console.error(err); body = `<div class="notice fail">Prototypen løb ind i en fejl: ${esc(err.message)} <button class="btn sm" data-act="reset">Nulstil demo</button></div>`; }
  document.title = PRODUCT_NAME;
  document.getElementById('root').innerHTML = `<div class="app">${topbar(p)}${sidenav(p)}<main>${body}</main>${statusbar(p)}</div>${sheet()}${player()}${toasts()}`;
  if (keep) { const el = document.getElementById(keep.id); if (el) { el.focus(); try { if (keep.s != null) el.setSelectionRange(keep.s, keep.e); } catch (e) { /* ikke et tekstfelt */ } } }
  save();
}
function topbar(p) {
  return `<header class="topbar">
    <button class="brand" data-act="home"><span class="brand-mark"><svg viewBox="0 0 16 16"><rect x="1" y="5" width="14" height="10" rx="1.5" fill="#fff"/><path d="M1 5 L3.5 1.5 L6.5 1.5 L4 5 M6.5 5 L9 1.5 L12 1.5 L9.5 5" stroke="#fff" stroke-width="1.4" fill="none"/></svg></span>${esc(PRODUCT_NAME)}</button>
    ${p ? `<div class="crumb"><span>/</span><strong>${esc(p.title)}</strong>${p.demo ? '<span class="pill draft">Demo · Golden Test Case</span>' : ''}</div>` : ''}
    <div class="spacer"></div>
    <span class="proto-tag">Prototype · simulerede AI-svar</span>
    <button class="btn sm" data-act="reset" title="Starter demoen forfra">Nulstil demo</button>
  </header>`;
}
function sidenav(p) {
  if (!p) return `<nav class="sidenav" aria-label="Hovedmenu"><div class="navgroup"><div class="label">Studie</div><button class="navitem active" data-act="home"><span class="grow">Alle film</span></button></div></nav>`;
  const wait = waitingCount(p), run = runningJobs(p).length;
  const dot = { brief: agg([p.brief.status, p.dna.status]), storyboard: p.storyboard.status,
    characters: agg(Object.values(p.assets).filter((a) => a.kind === 'character').map(assetStatus)),
    world: agg(Object.values(p.assets).filter((a) => a.kind !== 'character').map(assetStatus)) };
  return `<nav class="sidenav" aria-label="Projektmenu"><div class="navgroup"><div class="label">Filmen</div>${NAV.map(([v, t]) => {
    const extra = v === 'production' ? `${wait ? `<span class="badge">${wait}</span>` : ''}${run ? `<span class="badge gen">${run}</span>` : ''}` : dot[v] ? `<span class="pill bare ${dot[v]}" style="font-size:0" title="${ST[dot[v]]}"></span>` : '';
    return `<button class="navitem ${navActive(v) ? 'active' : ''}" data-act="nav" data-view="${v}"><span class="grow">${t}</span>${extra}</button>`;
  }).join('')}</div><div class="navgroup"><div class="label">Studie</div><button class="navitem" data-act="home"><span class="grow">Alle film</span></button></div></nav>`;
}
function statusbar(p) {
  if (!p) return '<div class="statusbar"><span class="muted">Prototype · AI-svar og billeder er simulerede med data fra Golden Test Case. Intet sendes til nogen AI-provider.</span></div>';
  const shots = shotList(p);
  const fa = shots.filter((s) => frameStatus(p, s) === 'approved').length;
  const vg = shots.filter((s) => ['needs_approval', 'approved', 'outdated'].includes(videoStatus(p, s))).length;
  const va = shots.filter((s) => videoStatus(p, s) === 'approved').length;
  const sep = '<span class="sep">·</span>';
  const run = runningJobs(p).length;
  return `<div class="statusbar"><span><b>${shots.length}</b> shots</span>${sep}<span><b>${fa}</b> startframes godkendt</span>${sep}<span><b>${vg}</b> videoer genereret</span>${sep}<span><b>${va}</b> godkendt</span>${sep}<button class="btn ghost sm" style="padding:0;color:var(--st-need)" data-act="nav" data-view="production"><b>${waitingCount(p)}</b>&nbsp;venter på dig</button>${run ? `${sep}<span style="color:var(--st-gen)"><b>${run}</b> genererer</span>` : ''}<span class="grow"></span><span class="muted">Budget ${kr(p.budget.spent)} af ${kr(p.budget.limit)}</span></div>`;
}
function projectView(p) {
  switch (S.view) {
    case 'brief': return viewBrief(p);
    case 'characters': return viewAssets(p, 'character');
    case 'world': return viewAssets(p, 'world');
    case 'asset': { const a = p.assets[S.assetId]; return viewAssets(p, a && a.kind === 'character' ? 'character' : 'world'); }
    case 'shot': return viewShot(p);
    case 'production': return viewProduction(p);
    default: return viewStoryboard(p);
  }
}

/* =====================================================================
   Alle film + ny film
   ===================================================================== */
function viewProjects() {
  const list = S.order.map((id) => S.projects[id]);
  return `<div class="pagehead"><div><h1>Dine film</h1><p class="sub">En film er et storyboard. Alt andet — karakterer, locations, billeder og video — hænger på storyboardets shots.</p></div><button class="btn primary" data-act="newProject">+ Ny film</button></div>
  <div class="stack">${list.map((p) => {
    const shots = shotList(p);
    const first = shots.find((s) => latest(s.frame) && latest(s.frame).status === 'approved');
    const done = shots.filter((s) => videoStatus(p, s) === 'approved').reduce((a, s) => a + s.duration, 0);
    return `<button class="projcard" data-act="openProject" data-id="${p.id}">
      ${first ? frameBox(p, first, 'frame', null, { tc: false }) : `<div class="frame"><div class="empty">Ingen billeder endnu</div></div>`}
      <div class="stack tight">
        <div class="row between"><div class="row"><h2>${esc(p.title)}</h2>${p.demo ? '<span class="pill draft">Demo · Golden Test Case</span>' : ''}</div>${waitingCount(p) ? pill('needs_approval', `${waitingCount(p)} venter på dig`) : ''}</div>
        <p class="muted">${esc(p.idea.idea)}</p>
        ${shots.length ? `<div class="timeline" style="height:12px">${shots.map((s) => `<i class="${shotState(p, s).st}" style="flex:${s.duration}"></i>`).join('')}</div>` : ''}
        <div class="row small muted"><span class="mono">${tc(done)} / ${tc(totalSec(p) || p.idea.duration)}</span><span>·</span><span>${shots.length} shots</span><span>·</span><span>${Object.values(p.assets).length} aktiver</span><span>·</span><span>oprettet ${esc(p.created)}</span></div>
      </div></button>`;
  }).join('')}</div>
  <div class="card" style="margin-top:20px"><div class="row between"><h3>Statusser</h3><span class="small muted">Bruges ens overalt</span></div><div class="legend" style="margin-top:10px">${STATUS_ORDER.map((s) => pill(s)).join('')}</div></div>`;
}
function viewNew() {
  return `<div class="pagehead"><div><span class="label">Ny film</span><h1 style="margin-top:4px">Hvad er idéen?</h1><p class="sub">Svarene bliver til et Film Brief og en Film DNA, som du godkender, før instruktøren tegner storyboardet.</p></div></div>
  ${ideaForm(S.draftIdea, 'createProject', 'Opret film og foreslå brief')}`;
}
function ideaForm(d, act, label, locked) {
  const dis = locked ? 'disabled' : '';
  return `<form class="card pad-lg stack" data-form="${act}">
    <div class="formgrid">
      <label class="field full">Arbejdstitel<input type="text" id="f_title" data-bind="title" value="${esc(d.title)}" ${dis}></label>
      <label class="field full">Hvad handler filmen om?<textarea id="f_idea" rows="3" data-bind="idea" ${dis}>${esc(d.idea)}</textarea></label>
      <label class="field full">Hvad er budskabet?<textarea id="f_message" rows="2" data-bind="message" ${dis}>${esc(d.message)}</textarea></label>
      <label class="field">Hvem er målgruppen?<input type="text" id="f_audience" data-bind="audience" value="${esc(d.audience)}" ${dis}></label>
      <label class="field">Hvad skal seeren føle eller forstå?<input type="text" id="f_feeling" data-bind="feeling" value="${esc(d.feeling)}" ${dis}></label>
      <label class="field">Længde<span class="hint">sekunder</span><input type="number" id="f_duration" min="20" max="180" data-bind="duration" value="${esc(d.duration)}" ${dis}></label>
      <label class="field">Antal shots<span class="hint">instruktøren fordeler længden</span><select id="f_shots" data-bind="shots" ${dis}>${[4, 5, 6, 7, 8, 9, 10, 11, 12].map((n) => `<option ${Number(d.shots) === n ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      <label class="field">Stil<select id="f_style" data-bind="style" ${dis}>${['Mockumentary', 'Dokumentar', 'Reklame', 'Komedie', 'Drama'].map((s) => `<option ${s === d.style ? 'selected' : ''}>${s}</option>`).join('')}</select></label>
    </div>
    ${locked ? `<div class="notice info"><span>🔒</span><div class="grow"><p>Idéen er låst, fordi briefet er godkendt.</p><p class="muted small">En ændring laver et nyt brief (v2), og alt nedstrøms markeres som forældet — intet slettes.</p></div></div>` : `<div class="row"><button class="btn primary" type="submit">${label}</button>${act === 'createProject' ? '<button class="btn" type="button" data-act="useGolden">Brug Golden Test Case</button><button class="btn" type="button" data-act="home">Fortryd</button>' : ''}</div>`}
  </form>`;
}

/* =====================================================================
   Storyboard — filmens centrum
   ===================================================================== */
function nextStep(p) {
  if (p.brief.status === 'draft' || p.brief.status === 'rejected') return { text: 'Start med idéen. Instruktøren foreslår brief og Film DNA ud fra den.', act: 'nav', view: 'brief', tab: 'idea', btn: 'Gå til idé' };
  if (p.brief.status === 'generating') return { text: 'Instruktøren skriver brief og Film DNA …' };
  if (p.brief.status === 'needs_approval' || p.dna.status === 'needs_approval') return { text: 'Brief og Film DNA venter på dig.', act: 'nav', view: 'brief', tab: p.brief.status === 'needs_approval' ? 'brief' : 'dna', btn: 'Læs og godkend' };
  if (p.storyboard.status === 'draft') return { text: 'Briefet er godkendt. Lad instruktøren tegne storyboardet.', act: 'generateStoryboard', btn: 'Foreslå storyboard' };
  if (p.storyboard.status === 'generating') return { text: 'Instruktøren tegner storyboardet og finder karakterer, locations og props …' };
  if (p.storyboard.status === 'needs_approval') return { text: 'Se storyboardet igennem. Godkender du det, bliver det sandhedskilden for hele filmen.', act: 'approveStoryboard', btn: 'Godkend storyboard', approve: true };
  const w = waitingCount(p);
  const pk = packages(p);
  const nPk = pk.masters.list.length + pk.frames.list.length + pk.videos.list.length;
  if (w) return { text: `${w} ting venter på dig i Produktion.`, act: 'nav', view: 'production', btn: 'Åbn Production Control' };
  if (nPk) return { text: `Klar til produktion: ${[pk.masters.list.length && `${pk.masters.list.length} masters`, pk.frames.list.length && `${pk.frames.list.length} startframes`, pk.videos.list.length && `${pk.videos.list.length} videoer`].filter(Boolean).join(', ')}.`, act: 'nav', view: 'production', btn: `Start produktion · ${kr(pk.masters.cost + pk.frames.cost + pk.videos.cost)}` };
  const noConsent = Object.values(p.assets).find((a) => a.kind === 'character' && !a.consent && !a.master);
  if (noConsent) return { text: `${noConsent.name} mangler samtykke, før der må genereres billeder.`, act: 'openAsset', id: noConsent.id, btn: `Åbn ${noConsent.name}` };
  if (runningJobs(p).length) return { text: 'Produktionen kører. Shots dukker op her, når de er klar til gennemsyn.' };
  return { text: 'Alt, der kan produceres lige nu, er produceret. Afspil filmen for at se den samlet.', act: 'playFilm', btn: 'Afspil film' };
}
function nextBar(p) {
  const n = nextStep(p);
  return `<div class="notice info"><span>→</span><div class="grow"><p>${esc(n.text)}</p></div>${n.btn ? `<button class="btn ${n.approve ? 'approve' : 'primary'} sm" data-act="${n.act}" data-view="${n.view || ''}" data-tab="${n.tab || ''}" data-id="${n.id || ''}">${esc(n.btn)}</button>` : ''}${n.approve ? '<button class="btn reject sm" data-act="rejectStoryboard">Afvis</button>' : ''}</div>`;
}
function viewStoryboard(p) {
  const sb = p.storyboard;
  const shots = shotList(p);
  const total = totalSec(p) || p.idea.duration;
  const done = shots.filter((s) => videoStatus(p, s) === 'approved').reduce((a, s) => a + s.duration, 0);
  const head = `<div class="filmhead"><div class="titlerow"><div><span class="label">Storyboard${sb.version ? ' · v' + sb.version : ''} · sandhedskilden</span><h1 style="margin-top:4px">${esc(p.title)}</h1></div>
    <div class="row"><span class="filmtc" title="Godkendt video / filmens længde">${tc(done)} <span>/ ${tc(total)}</span></span>${shots.length ? `<button class="btn" data-act="playFilm">▶ Afspil film</button><div class="seg"><button class="${S.sbMode === 'strip' ? 'on' : ''}" data-act="sbMode" data-mode="strip">Billeder</button><button class="${S.sbMode === 'table' ? 'on' : ''}" data-act="sbMode" data-mode="table">Tabel</button></div>` : ''}</div></div>
    ${shots.length ? `<div class="timeline" role="list" aria-label="Filmens shots i rækkefølge">${shots.map((s) => { const st = shotState(p, s); return `<button role="listitem" class="${st.st}" style="flex:${s.duration}" data-act="openShot" data-id="${s.id}" title="${s.code} · ${s.duration} sek. · ${st.label}">${s.code.slice(5)}</button>`; }).join('')}</div>
    <div class="tl-legend"><span>Farven viser, hvor langt hvert shot er:</span>${['approved', 'needs_approval', 'generating', 'draft', 'outdated', 'failed'].map((s) => `<span class="row" style="gap:5px"><span class="dots"><i class="${s}"></i></span>${{ approved: 'Færdig', needs_approval: 'Venter på dig', generating: 'Genererer', draft: 'Ikke lavet', outdated: 'Forældet', failed: 'Fejlet' }[s]}</span>`).join('')}</div>` : ''}
    ${nextBar(p)}</div>`;
  if (sb.status === 'draft' || sb.status === 'generating') {
    return head + `<div class="card pad-lg">${sb.status === 'generating' ? `<div class="shimmer" style="position:relative;height:220px;border-radius:10px">Instruktøren tegner ${p.idea.shots || 8} shots og finder aktiverne …</div>` : `<div class="stack"><h2>Her bliver filmen til</h2><p class="muted">Når briefet er godkendt, tegner instruktøren ${p.idea.shots || 8} shots på ${p.idea.duration} sek. og trækker karakterer, locations, køretøjer og props ud som aktiver, du godkender hver for sig.</p></div>`}</div>`;
  }
  const borrowedSb = p.borrowed ? `<div class="notice info" style="margin-bottom:16px"><span>i</span><div class="grow small">Prototype: shots, karakterer og aktiver er lånt fra Golden Test Case, fordi der ikke er koblet en AI på.</div></div>` : '';
  if (S.sbMode === 'table') return head + borrowedSb + sbTable(p);
  const cells = [];
  let t = 0;
  for (const sc of p.scenes) {
    const list = shots.filter((s) => s.scene === sc.id);
    if (!list.length) continue;
    cells.push(`<div class="scene-divider"><span class="code">SCENE ${String(sc.n).padStart(2, '0')}</span><b>${esc(sc.heading)}</b><span class="muted small">${esc(sc.purpose)}</span></div>`);
    for (const s of list) { cells.push(shotFrame(p, s, t)); t += s.duration; }
  }
  return head + borrowedSb + `<div class="strip">${cells.join('')}</div>`;
}
function shotFrame(p, s, start) {
  const st = shotState(p, s);
  const fs = frameStatus(p, s), vs = videoStatus(p, s);
  const useVideo = latest(s.video) && ['approved', 'needs_approval'].includes(latest(s.video).status);
  return `<button class="sframe ${st.st === 'outdated' ? 'is-old' : st.label === 'Kræver et valg' ? 'is-warn' : ''}" data-act="openShot" data-id="${s.id}">
    ${frameBox(p, s, useVideo ? 'video' : 'frame', null, { noPlay: true })}
    <div class="cap1"><span class="shotcode">${s.code}</span><span class="tcs">${tc(start)} · ${s.duration} sek.</span></div>
    <p class="say">${esc(s.action)}</p>
    <div class="cap2">${pill(st.st, st.label)}<span class="row" style="gap:8px">${faces(p, s)}<span class="dots" title="Startframe: ${ST[fs]} · Video: ${ST[vs]}"><i class="${fs}"></i><i class="${vs}"></i></span></span></div>
  </button>`;
}
function sbTable(p) {
  const shots = shotList(p);
  const names = (s, kinds) => s.assets.filter((r) => p.assets[r.id] && kinds.includes(p.assets[r.id].kind)).map((r) => chip(p, r)).join(' ') || '<span class="faint">—</span>';

  ${shots.map((s) => `<tr class="click" data-act="openShot" data-id="${s.id}"><td class="shotcode">${s.code}</td><td class="thumb">${frameBox(p, s, 'frame', null, { tc: false })}</td><td>${names(s, ['character'])}</td><td>${names(s, ['location'])}</td><td>${names(s, ['vehicle', 'prop'])}</td><td class="small">${SHOT_TYPES[s.camera.type]}<br><span class="mono muted">${s.camera.lens} mm · ${MOVES[s.camera.move]}</span></td><td class="mono">${s.duration}</td><td>${pill(frameStatus(p, s))}</td><td>${pill(videoStatus(p, s))}</td></tr>`).join('')}

/* =====================================================================
   Brief, Film DNA og filmregler
   ===================================================================== */
function viewBrief(p) {
  const tab = S.briefTab;
  const tabs = [['idea', 'Idé', p.ideaStatus], ['brief', 'Film Brief', p.brief.status], ['dna', 'Film DNA', p.dna.status], ['rules', 'Filmregler', 'approved']];
  let body;
  if (tab === 'idea') {
    if (!S.draftIdea || S.draftIdea.pid !== p.id) S.draftIdea = { ...p.idea, pid: p.id };
    body = ideaForm(S.draftIdea, 'generateBrief', p.brief.version ? `Foreslå nyt brief (v${p.brief.version + 1})` : 'Foreslå brief og Film DNA', p.brief.status === 'approved' || p.brief.status === 'generating');
  } else if (tab === 'dna') body = dnaView(p);
  else if (tab === 'rules') body = rulesView(p);
  else body = briefContent(p);
  const borrowed = p.borrowed ? `<div class="notice info" style="margin-bottom:16px"><span>i</span><div class="grow small">Prototype: dine egne svar bruges, hvor de findes. Tone, nøgleøjeblikke, Film DNA og regler er lånt fra Golden Test Case, fordi der ikke er koblet en AI på.</div></div>` : '';
  return borrowed + `<div class="pagehead"><div><span class="label">Brief og Film DNA</span><h1 style="margin-top:4px">Hvad er filmen, og hvordan skal den se ud?</h1><p class="sub">Briefet siger, hvad filmen handler om. Film DNA og filmreglerne siger, hvordan den skal se ud — og bruges automatisk i alle shots.</p></div></div>
  <div class="tabs">${tabs.map(([k, t, st]) => `<button class="${tab === k ? 'on' : ''}" data-act="briefTab" data-tab="${k}">${t}${k !== 'rules' ? pill(st) : `<span class="mono" style="font-size:11px;opacity:.7">${p.rules.filter((r) => r.on).length}</span>`}</button>`).join('')}</div>${body}`;
}
function briefContent(p) {
  const b = p.brief;
  if (b.status === 'generating') return `<div class="card pad-lg"><div class="shimmer" style="position:relative;height:160px;border-radius:10px">Instruktøren skriver brief og Film DNA ud fra idéen …</div></div>`;

      <div class="row between"><span class="label">Film Brief · v${b.version}</span>${pill(b.status)}</div>
      <p style="font-size:18px;line-height:1.45">${esc(c.logline)}</p>
      <dl class="facts"><dt>Budskab</dt><dd>${esc(c.message)}</dd><dt>Målgruppe</dt><dd>${esc(c.audience)}</dd><dt>Følelse</dt><dd>${esc(c.feeling)}</dd><dt>Længde</dt><dd>${c.duration} sek. · ${p.idea.shots || Object.keys(p.shots).length} shots</dd><dt>Stil</dt><dd>${esc(c.style)}</dd><dt>Tone</dt><dd>${esc(c.tone)}</dd></dl>

      ${c.questions.length ? `<div class="notice warn"><span>?</span><div class="grow"><p><b>Her har instruktøren valgt for dig</b></p>${c.questions.map((q) => `<p>${esc(q)}</p>`).join('')}</div></div>` : ''}
    </div><div class="stack">
      ${b.status === 'needs_approval' ? `<div class="card stack"><h2>Din beslutning</h2><p class="muted">Storyboardet tegnes først, når briefet er godkendt.</p><div class="row"><button class="btn approve" data-act="approveBrief">Godkend brief</button><button class="btn reject" data-act="rejectBrief">Afvis og ret idéen</button></div></div>` : ''}
      ${b.status === 'approved' ? `<div class="notice ok"><span>✓</span><div class="grow"><p>Godkendt. Storyboardet bygger på denne version.</p></div></div>` : ''}
      <div class="card stack tight"><div class="row between"><span class="label">Film DNA</span>${pill(p.dna.status)}</div><p class="small">${esc(p.dna.fields['Genre'])} · ${esc(p.dna.fields['Visuelt sprog'])} · ${esc(p.dna.fields['Kamera'])}</p><div><button class="btn sm" data-act="briefTab" data-tab="dna">Åbn Film DNA</button></div></div>

function rulesView(p) {

    <form class="row" data-form="addRule"><input type="text" id="new_rule" placeholder="Ny regel, fx: Ingen slowmotion" style="flex:1;min-width:200px"><button class="btn" type="submit">Tilføj regel</button></form>
  </div><div class="card stack tight"><span class="label">Sådan virker det</span><p class="small">Regler med et søgeord tjekkes mod hvert shots handling og noter. Bryder et shot en regel, kan det ikke produceres, før du har rettet eller tilladt det.${p.demo ? ' I Golden Test Film bryder SHOT_10 reglen om droneoptagelser.' : ''}</p></div></div>`;
}

/* =====================================================================

function usage(p, a) { return shotList(p).filter((s) => s.assets.some((r) => r.id === a.id)); }
function viewAssets(p, group) {
  const isChar = group === 'character';
  const list = Object.values(p.assets).filter((a) => (isChar ? a.kind === 'character' : a.kind !== 'character'));
  const cur = S.view === 'asset' && list.some((a) => a.id === S.assetId) ? p.assets[S.assetId] : list[0];
  const head = `<div class="pagehead"><div><span class="label">${isChar ? 'Character Studio' : 'Location Studio og aktiver'}</span><h1 style="margin-top:4px">${isChar ? 'Karakterer' : 'Locations og aktiver'}</h1><p class="sub">${isChar ? 'Hver karakter har én godkendt master. Alle shots bruger den, og systemet ændrer den aldrig selv — en ændring er en ny version.' : 'Locations husker arkitektur, tid på dagen, lys, vejr og farver. Køretøjer og props genbruges på samme måde, så AI\'en ikke opfinder en ny gade eller varevogn i hvert shot.'}</p></div><div class="row">${isChar ? `<button class="btn" data-act="newAsset" data-kind="character">+ Ny karakter</button>` : `<button class="btn" data-act="newAsset" data-kind="location">+ Location</button><button class="btn" data-act="newAsset" data-kind="vehicle">+ Køretøj</button><button class="btn" data-act="newAsset" data-kind="prop">+ Prop</button>`}</div></div>`;
  if (!list.length) return head + `<div class="card pad-lg stack"><p>Ingen ${isChar ? 'karakterer' : 'locations eller aktiver'} endnu.</p><p class="muted">Instruktøren finder dem, når storyboardet tegnes. Du kan også oprette dem selv.</p></div>`;
  const grouped = isChar ? [['character', list]] : ['location', 'vehicle', 'prop'].map((k) => [k, list.filter((a) => a.kind === k)]).filter(([, l]) => l.length);
  return head + `<div class="cols side"><div class="stack">${grouped.map(([k, l]) => `<div class="assetlist">${isChar ? '' : `<span class="label" style="padding:4px 8px">${KIND[k].plural}</span>`}${l.map((a) => `<button class="assetrow ${cur && a.id === cur.id ? 'on' : ''}" data-act="openAsset" data-id="${a.id}">${avatar(a)}<div class="grow"><div style="font-weight:600">${esc(a.name)}</div><div class="mono faint">${a.code}</div></div>${pill(assetStatus(a))}</button>`).join('')}</div>`).join('')}</div>${cur ? assetDetail(p, cur) : ''}</div>`;
}
function assetDetail(p, a) {
  const selV = S.assetV && S.assetV.id === a.id ? a.versions.find((v) => v.v === S.assetV.v) : null;
  const ver = selV || assetLatest(a);
  const editable = ver.status === 'draft' || ver.status === 'rejected';
  const used = usage(p, a);
  const roles = REF_ROLES[a.kind];
  const wide = a.kind !== 'character';
  const onOld = used.filter((s) => s.assets.some((r) => r.id === a.id && a.master && r.v < a.master && !r.pinned));
  let action = '';
  if (editable) action = a.kind === 'character' && !a.consent
    ? `<div class="notice warn"><span>!</span><div class="grow"><p><b>Samtykke mangler.</b> Er ${esc(a.name)} baseret på en rigtig person, skal der ligge et samtykke, før der må genereres billeder. Flere providere kræver det også selv.</p><button class="btn sm" style="margin-top:8px" data-act="consent" data-id="${a.id}">Samtykke foreligger</button></div></div>`
    : `<div class="row"><button class="btn primary" data-act="genMaster" data-id="${a.id}" data-v="${ver.v}">Generér master-referencer <span class="cost">ca. ${kr(MASTER_PRICE)}</span></button><span class="small muted">eller saml flere i Production Control</span></div>`;
  else if (ver.status === 'generating') action = pill('generating', 'Genererer master-referencer …');
  else if (ver.status === 'needs_approval') action = `<div class="row"><button class="btn approve" data-act="approveAsset" data-id="${a.id}" data-v="${ver.v}">Godkend som master</button><button class="btn reject" data-act="rejectAsset" data-id="${a.id}" data-v="${ver.v}">Afvis</button></div>`;
  else if (ver.status === 'approved' && a.master !== ver.v) action = `<button class="btn" data-act="makeMaster" data-id="${a.id}" data-v="${ver.v}">Gør v${ver.v} til master</button>`;
  else if (ver.status === 'approved') action = `<button class="btn" data-act="newVersion" data-id="${a.id}">Lav ny version (v${assetLatest(a).v + 1})</button>`;
  return `<div class="card pad-lg stack">
    <div class="row between top"><div class="stack tight"><div class="row"><h2 style="font-size:20px">${esc(a.name)}</h2>${pill(ver.status)}${a.master === ver.v ? '<span class="pill approved" style="background:none;border:1px solid currentColor">Master</span>' : ''}</div><div class="row small muted"><span class="mono">${a.code}</span><span>·</span><span>${esc(a.role)}</span><span>·</span><span>bruges i ${used.length} shots</span></div></div>
    <div class="versions">${a.versions.map((v) => `<button class="vtab ${v.v === ver.v ? 'on' : ''}" data-act="selAssetV" data-id="${a.id}" data-v="${v.v}">v${v.v}${a.master === v.v ? '<span class="star">MASTER</span>' : ''}<span class="pill bare ${v.status}" style="font-size:0"></span></button>`).join('')}</div></div>
    ${onOld.length && a.master === ver.v ? `<div class="notice old"><span>↻</span><div class="grow"><p><b>${onOld.length} shots bygger stadig på en ældre version:</b> ${onOld.map((s) => s.code).join(', ')}.</p><p class="small">Hvorfor: de blev lavet, før v${a.master} blev master. De er markeret som forældede, indtil du vælger at opdatere eller bevidst beholde den gamle version.</p></div></div>` : ''}
    <div><div class="section-title"><h3>Referencer</h3><span class="small muted">${ver.status === 'approved' ? 'Låst — godkendt version' : 'Upload egne billeder, eller lad systemet generere'}</span></div>
    <div class="refgrid" style="${wide ? 'grid-template-columns:repeat(auto-fill,minmax(170px,1fr))' : ''}">${roles.map(([r, label]) => {
      const ref = ver.refs[r];
      let box;
      if (ref && ref.src === 'upload') box = `<div class="frame"><img alt="${esc(label)}" src="${ref.data}"></div>`;
      else if (ref) box = `<div class="frame">${assetSVG(a, r, ver.v, ver.v)}</div>`;
      else if (ver.status === 'generating') box = `<div class="frame"><div class="shimmer">Genererer …</div></div>`;
      else if (editable) box = `<div class="frame"><label class="uploadbtn">+ Upload<br>${esc(label.toLowerCase())}<input type="file" accept="image/*" data-upload="${a.id}" data-v="${ver.v}" data-role="${r}"></label></div>`;
      else box = `<div class="frame"><div class="empty">Ingen</div></div>`;
      return `<div class="refslot ${wide ? 'wide' : ''}">${box}<div class="cap"><span>${esc(label)}</span><span class="faint">${ref ? (ref.src === 'upload' ? 'upload' : 'genereret') : ''}</span></div></div>`;
    }).join('')}</div></div>
    <div><div class="section-title"><h3>Identitet</h3><span class="small muted">${editable ? 'Ret før generering' : 'Bruges ordret i alle prompts'}</span></div>
    <div class="attrtable">${Object.entries(ver.attrs).map(([k, v]) => `<div class="k">${esc(k)}</div><div>${editable ? `<input type="text" id="attr_${a.id}_${ver.v}_${k.replace(/\W/g, '')}" data-attr="${esc(k)}" data-aid="${a.id}" data-v="${ver.v}" value="${esc(v)}">` : esc(v)}</div>`).join('')}</div></div>
    ${ver.note ? `<p class="small muted">Ændring i denne version: ${esc(ver.note)}</p>` : ''}
    <div>${action}</div>
    <div><div class="section-title"><h3>Bruges i</h3></div><div class="strip" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px">${used.map((s) => { const r = s.assets.find((x) => x.id === a.id); const old = a.master && r.v < a.master && !r.pinned; return `<button class="sframe ${old ? 'is-old' : ''}" data-act="openShot" data-id="${s.id}">${frameBox(p, s, 'frame', null, { tc: false })}<span class="row small" style="justify-content:space-between"><span class="mono">${s.code}</span><span class="mono faint">v${r.v}</span></span></button>`; }).join('') || '<span class="muted">Ingen shots endnu</span>'}</div></div>
  </div>`;
}

/* =====================================================================
   Shot Editor: Instruktion → Produktion → AI-prompt
   ===================================================================== */
function compilePrompt(p, s) {
  const out = [];
  out.push(`<b>Film DNA v${p.dna.version}:</b> ${DNA_FIELDS.map((f) => `${f.toLowerCase()}: ${esc(p.dna.fields[f])}`).join('; ')}`);
  const rules = p.rules.filter((r) => r.on).map((r) => r.text.toLowerCase());
  if (rules.length) out.push(`<b>Undgå (filmregler):</b> ${esc(rules.join('; '))}`);
  out.push(`<b>Kamera:</b> ${SHOT_TYPES[s.camera.type]}, ${s.camera.lens} mm, ${MOVES[s.camera.move].toLowerCase()}, ${s.duration} sek.`);
  for (const r of s.assets) {
    const a = p.assets[r.id]; if (!a) continue;
    const v = a.versions.find((x) => x.v === r.v) || assetLatest(a);
    const attrs = Object.entries(v.attrs).map(([k, val]) => { const dev = s.deviations.find((d) => d.type === 'attr' && d.assetId === a.id && d.attr === k); return dev ? `${k.toLowerCase()}: <mark>${esc(dev.value)} (tilladt afvigelse)</mark>` : `${k.toLowerCase()}: ${esc(val)}`; }).join('; ');
    out.push(`<b>${KIND[a.kind].label} ${esc(a.code)} v${r.v}</b> — ${esc(a.name)}: ${attrs}. [${Object.keys(v.refs).length} referencebilleder vedlagt]`);
  }
  let action = esc(s.action), notes = esc(s.notes);
  for (const c of openConflicts(p, s)) { const m = esc(c.shot); action = action.replace(m, `<mark>${m}</mark>`); notes = notes.replace(m, `<mark>${m}</mark>`); }
  out.push(`<b>Handling:</b> ${action}`);
  out.push(`<b>Spil:</b> ${esc(s.performance.toLowerCase())}`);
  if (s.dialogue) out.push(`<b>Replik (til lyd, MVP 4):</b> "${esc(s.dialogue)}"`);
  if (s.notes) out.push(`<b>Noter:</b> ${notes}`);
  out.push(`<b>Lys:</b> ${esc(s.lighting)}`);
  return out.join('\n');
}
function conflictCard(p, s, c) {
  const consequence = c.type === 'rule'
    ? `Shottet bryder filmens stil (${esc(c.why)}) og vil skille sig ud, når shots vises efter hinanden.`
    : `${esc(c.assetName)}s godkendte design ændres i netop dette shot, så ${esc(c.assetName)} ikke ser ens ud gennem filmen.`;
  return `<div class="notice warn" style="display:block"><div class="row between" style="margin-bottom:8px"><b>${c.type === 'rule' ? 'Filmregel brudt' : 'Kontinuitetskonflikt'}</b><span class="small">${c.type === 'rule' ? 'Film-regel' : `${esc(c.assetName)} v${c.v}`}</span></div>
    <dl class="why"><dt>Dit shot siger</dt><dd class="quote">"${esc(c.shot)}"</dd>
    <dt>${c.type === 'rule' ? 'Filmreglen siger' : `${esc(c.assetName)} v${c.v} siger`}</dt><dd class="quote">${c.type === 'rule' ? esc(c.rule) : `${esc(c.attr)}: ${esc(c.master)}`}</dd>
    <dt>Konsekvens</dt><dd>${consequence}</dd></dl>
    <div class="row" style="margin-top:10px"><button class="btn sm" data-act="fixConflict" data-id="${s.id}" data-key="${esc(c.key)}">Ret automatisk</button><button class="btn sm" data-act="allowDeviation" data-id="${s.id}" data-key="${esc(c.key)}">Tillad afvigelse</button><span class="small">Du ser præcis, hvad der blev rettet, og kan fortryde.</span></div></div>`;
}
function viewShot(p) {
  const s = p.shots[S.shotId];
  if (!s) return '<p>Shottet findes ikke.</p>';
  const all = shotList(p);
  const idx = all.indexOf(s);
  const prev = all[(idx - 1 + all.length) % all.length], next = all[(idx + 1) % all.length];
  const start = all.slice(0, idx).reduce((a, x) => a + x.duration, 0);
  const sc = p.scenes.find((x) => x.id === s.scene);
  const fs = frameStatus(p, s), vs = videoStatus(p, s);
  const fg = frameGates(p, s), vg = videoGates(p, s);
  const oc = openConflicts(p, s);
  const stale = staleRefs(p, s);
  const lf = latest(s.frame), lv = latest(s.video);
  const fSel = S.frameSel && S.frameSel.id === s.id ? S.frameSel.n : (lf ? lf.n : null);
  const vSel = S.videoSel && S.videoSel.id === s.id ? S.videoSel.n : (lv ? lv.n : null);
  const fCur = fSel ? s.frame.versions.find((x) => x.n === fSel) : null;
  const locked = p.storyboard.status !== 'approved';

  const slotAction = (which, cur, gates, st) => {
    const r = recommend(p, s, which);
    const genBtn = (label) => `<button class="btn primary" data-act="gen" data-slot="${which}" data-id="${s.id}">${label} <span class="cost">ca. ${kr(r.pick ? r.pick.price : 0)}</span></button>`;
    if (!cur) return gatesOk(gates) ? genBtn(`Generér ${which === 'frame' ? 'startframe' : 'video'}`) : '';
    if (cur.status === 'needs_approval' && st !== 'outdated') return `<div class="row"><button class="btn approve" data-act="approveSlot" data-slot="${which}" data-id="${s.id}" data-n="${cur.n}">Godkend v${cur.n}</button><button class="btn reject" data-act="rejectSlot" data-slot="${which}" data-id="${s.id}" data-n="${cur.n}">Afvis</button></div>`;
    if (cur.status === 'generating') return pill('generating', `Genererer v${cur.n} hos ${cur.provider} …`);
    return gatesOk(gates) ? genBtn(cur.status === 'failed' ? 'Prøv igen' : 'Generér ny version') : '';
  };

  const lv1 = `<div class="card stack">
      <label class="field">Hvad skal ske?<span class="hint">Skriv det, som du ville sige det til en fotograf</span><textarea class="director" id="sp_action_${s.id}" rows="4" data-spec="action" data-id="${s.id}">${esc(s.action)}</textarea></label>

  const lv3 = `<div class="card stack">

function contRows(p, s) {
  const cons = conflicts(p, s);
  const rows = [];
  for (const r of s.assets) {
    const a = p.assets[r.id];
    const c = cons.filter((x) => x.type === 'attr' && x.assetId === a.id);
    if (!c.length) rows.push(`<div class="controw"><span>${esc(a.name)} v${r.v}</span><span class="res match">Match</span></div>`);
    for (const x of c) rows.push(`<div class="controw ${x.allowed ? '' : 'conflict'}"><span>${esc(a.name)} · ${esc(x.attr)}</span><span class="res ${x.allowed ? 'dev' : 'conflict'}">${x.allowed ? 'Tilladt afvigelse' : 'Konflikt'}</span></div>`);
  }
  const rc = cons.filter((x) => x.type === 'rule');
  rows.push(`<div class="controw ${rc.some((x) => !x.allowed) ? 'conflict' : ''}"><span>Filmregler (${p.rules.filter((r) => r.on).length})</span><span class="res ${rc.some((x) => !x.allowed) ? 'conflict' : rc.length ? 'dev' : 'match'}">${rc.some((x) => !x.allowed) ? 'Brudt' : rc.length ? 'Tilladt afvigelse' : 'Overholdt'}</span></div>`);
  return rows.join('');
}

  return `<div class="pagehead"><div><span class="label">Produktion</span><h1 style="margin-top:4px">${S.prodTab === 'queue' ? 'Produktionskø' : 'Production Control'}</h1><p class="sub">${S.prodTab === 'queue' ? 'Hvert forsøg hos hver provider. Fejler en provider, prøver systemet den næste — men først når det forrige job er bekræftet stoppet, så intet betales to gange.' : 'Her starter du produktionen. Betalte generationer samles i pakker med samlet pris, og alt, der venter på dit ja, ligger samme sted.'}</p></div>${tabs}</div>
  ${journeyBar}${S.prodTab === 'queue' ? queueTable(p) : controlView(p)}`;
}

  const thumbs = (list, kind) => `<div class="thumbs">${list.slice(0, 12).map((x) => kind === 'asset' ? `<div class="frame" title="${esc(x.name)}" style="aspect-ratio:1">${avatarSVG(x) || `<div class="empty">${KIND[x.kind].code}</div>`}</div>` : `<div class="frame" title="${x.code}">${kind === 'video' ? frameBox(p, x, 'frame', null, { tc: false }) : sceneSVG(p, x, 1)}</div>`).join('')}</div>`;

  const total = (sel.masters ? pk.masters.cost : 0) + (sel.frames ? pk.frames.cost : 0) + (sel.videos ? pk.videos.cost : 0);

  const review = reviewItems(p), choices = choiceItems(p);

    if (i.type === 'video') return frameBox(p, p.shots[i.id], 'video', latest(p.shots[i.id].video).n, { tc: false, noPlay: true });
    if (i.type === 'asset') { const a = p.assets[i.id]; return `<div class="frame">${assetSVG(a, REF_ROLES[a.kind][0][0], 1, assetLatest(a).v)}</div>`; }
    return `<div class="frame"><div class="empty">${{ brief: 'Film Brief', dna: 'Film DNA', storyboard: 'Storyboard' }[i.type]}</div></div>`;

    if (i.type === 'dna') return `<button class="btn approve sm" data-act="approveDna">Godkend</button><button class="btn sm" data-act="nav" data-view="brief" data-tab="dna">Læs</button>`;

    if (i.type === 'asset') { const v = assetLatest(p.assets[i.id]).v; return `<button class="btn approve sm" data-act="approveAsset" data-id="${i.id}" data-v="${v}">Godkend som master</button><button class="btn reject sm" data-act="rejectAsset" data-id="${i.id}" data-v="${v}">Afvis</button>`; }
    const n = latest(p.shots[i.id][i.type]).n;

  const nFrames = review.filter((i) => i.type === 'frame').length, nVids = review.filter((i) => i.type === 'video').length;

    <div class="card flush"><div class="section-title" style="padding:14px 16px 0"><h2>Til gennemsyn</h2><div class="row">${nFrames > 1 ? `<button class="btn approve sm" data-act="approveAll" data-slot="frame">Godkend alle ${nFrames} startframes</button>` : ''}${nVids > 1 ? `<button class="btn approve sm" data-act="approveAll" data-slot="video">Godkend alle ${nVids} videoer</button>` : ''}${pill(review.length ? 'needs_approval' : 'approved', review.length ? `${review.length} venter` : 'Intet venter')}</div></div>

    </div>

    ${p.budget.spent + total > p.budget.limit ? '<div class="notice fail"><span>!</span><div class="grow small">Over budget. Fravælg en pakke, eller hæv budgettet.</div></div>' : ''}
    <button class="btn primary" style="justify-content:center;padding:12px" data-act="startProduction" ${count && p.budget.spent + total <= p.budget.limit ? '' : 'disabled'}>Godkend produktion</button>
    <p class="small muted">Dit ja reserverer beløbet. Hvert resultat skal stadig godkendes bagefter, før det bruges i filmen. Masters laves før startframes, startframes før video.</p>

function jobTarget(p, j) {
  if (j.target.type === 'asset') { const a = p.assets[j.target.id]; if (!a) return { code: '—', label: '', status: 'draft', open: '' }; return { code: a.code, label: 'Master-referencer', status: (a.versions.find((v) => v.v === j.target.n) || {}).status, open: `data-act="openAsset" data-id="${a.id}"` }; }
  const s = p.shots[j.target.id]; if (!s) return { code: '—', label: '', status: 'draft', open: '' };
  const v = s[j.target.slot].versions.find((x) => x.n === j.target.n);
  return { code: s.code, label: j.target.slot === 'frame' ? `Startframe v${j.target.n}` : `Video v${j.target.n}`, status: v ? v.status : 'draft', open: `data-act="openShot" data-id="${s.id}"` };
}
function queueTable(p) {

  const attemptSt = { done: ['approved', 'Leveret'], failed: ['failed', 'Fejlet'], waiting: ['draft', 'Venter'], generating: ['generating', 'Genererer'] };
  const rows = [];
  for (const j of jobs) {
    const t = jobTarget(p, j);
    const outcome = j.status === 'done' ? pill(t.status) : j.status === 'failed' ? pill('failed') : pill('generating');
    j.attempts.forEach((a, i) => {
      const [st, lab] = attemptSt[a.status] || ['draft', a.status];
      rows.push(`<tr class="${i ? 'sub' : ''}">
        <td>${i ? '' : `<button class="btn ghost sm mono" style="padding:0" ${t.open}>${esc(t.code)}</button>`}</td>
        <td>${i ? '<span class="arrow">↳ reserve</span>' : esc(t.label)}</td>
        <td>${esc(a.provider)}</td>
        <td class="st">${pill(st, lab)}</td>
        <td class="small muted">${esc(a.note || '')}</td>
        <td>${i === j.attempts.length - 1 ? outcome : ''}</td>
        <td class="mono small">${i ? '' : `${kr(j.cost)} · ${esc(j.at)}`}</td>
        <td>${i === j.attempts.length - 1 && j.status === 'failed' ? `<button class="btn sm" data-act="retryJob" data-job="${j.id}">Prøv igen</button>` : i === j.attempts.length - 1 && t.status === 'needs_approval' ? `<button class="btn sm" ${t.open}>Se og godkend</button>` : ''}</td>
      </tr>`);
    });
  }
  return `<div class="card flush tablewrap"><table class="data qtable"><thead><tr><th>Shot</th><th>Opgave</th><th>Provider</th><th>Forsøg</th><th>Forløb</th><th>Resultat</th><th>Pris</th><th></th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
}

/* =====================================================================
   Simuleret produktion
   ===================================================================== */
function versionOf(p, j) {
  if (j.target.type === 'asset') { const a = p.assets[j.target.id]; return a ? a.versions.find((x) => x.v === j.target.n) : null; }
  const s = p.shots[j.target.id]; return s ? s[j.target.slot].versions.find((x) => x.n === j.target.n) : null;
}
function finishJob(pid, j, ok) {
  const p = S.projects[pid]; if (!p) return;
  const v = versionOf(p, j); const last = j.attempts[j.attempts.length - 1];
  if (ok) {
    last.status = 'done'; last.note = 'Leveret'; j.status = 'done'; p.budget.spent += j.cost;
    if (v) {
      v.status = 'needs_approval'; v.provider = last.provider;
      if (j.target.type === 'asset') { const a = p.assets[j.target.id]; for (const [r] of REF_ROLES[a.kind].slice(0, a.kind === 'character' ? 4 : 3)) if (!v.refs[r]) v.refs[r] = { src: 'gen' }; }
    }
    const t = jobTarget(p, j); toast(`${t.code}: ${t.label.toLowerCase()} er klar til gennemsyn`);
  } else { j.status = 'failed'; if (v) v.status = 'failed'; }
  render();
}
/* Kører et job. failover=true: første provider fejler teknisk, den næste overtager. */
function runJob(pid, j, ms, failover = false) {
  j.status = 'generating';
  const cur = j.attempts[j.attempts.length - 1];
  if (cur.status === 'waiting') {
    setTimeout(() => { cur.status = 'generating'; cur.note = ''; render(); }, 1200);
    setTimeout(() => finishJob(pid, j, true), 1200 + ms);
    return;
  }
  cur.status = 'generating';
  if (!failover) { setTimeout(() => finishJob(pid, j, true), ms); return; }
  setTimeout(() => {
    const p = S.projects[pid]; if (!p) return;
    cur.status = 'failed'; cur.note = 'Teknisk fejl: intet svar. Stoppet og bekræftet — ikke betalt.';
    const alt = PROVIDERS.video.find((m) => m.name !== cur.provider);
    j.attempts.push({ provider: alt.name, status: 'waiting', note: 'Venter på ledig kapacitet' }); j.provider = alt.name;
    const v = versionOf(p, j); if (v) v.provider = alt.name;
    render();
    runJob(pid, j, ms);
  }, ms * 0.6);
}
function startGen(p, slot, shotId) {
  const s = p.shots[shotId];
  const r = recommend(p, s, slot); if (!r.pick) return;
  const n = s[slot].versions.length + 1;
  s[slot].versions.push(mkVersion(n, 'generating', { provider: r.pick.name }));
  const j = { id: nextId('job'), target: { type: 'shot', id: shotId, slot, n }, slot, provider: r.pick.name, cost: r.pick.price, status: 'queued', at: 'lige nu', attempts: [{ provider: r.pick.name, status: 'generating', note: '' }] };
  p.jobs.push(j);
  const doFailover = slot === 'video' && !!r.fallback && !!p.flags && p.flags.failoverOnFirstVideo && !p.flags.failoverUsed;
  if (doFailover) p.flags.failoverUsed = true;
  runJob(p.id, j, slot === 'frame' ? 2000 + Math.random() * 1400 : 3400 + Math.random() * 1600, doFailover);
}
function startMaster(p, a) {
  const ver = assetLatest(a);
  ver.status = 'generating';
  const j = { id: nextId('job'), target: { type: 'asset', id: a.id, n: ver.v }, slot: 'master', provider: 'Billedmodel B', cost: MASTER_PRICE, status: 'queued', at: 'lige nu', attempts: [{ provider: 'Billedmodel B', status: 'generating', note: '' }] };
  p.jobs.push(j);
  runJob(p.id, j, 2000 + Math.random() * 1200);
}
function genBrief(p) {
  p.brief.status = 'generating'; p.dna.status = 'generating'; p.ideaStatus = 'approved';
  setTimeout(() => {
    const sp = S.projects[p.id]; if (!sp) return;
    sp.brief.version += 1; sp.dna.version = Math.max(1, sp.dna.version);
    // Brugerens egne svar bruges, hvor de findes. Resten er lånt fra Golden Test Case,
    // fordi prototypen ikke har en rigtig AI koblet på — og det siges tydeligt i UI'et.
    const first = (sp.idea.idea || '').split(/(?<=\.)\s/)[0];
    sp.brief.content = { ...GOLDEN_BRIEF, logline: first || GOLDEN_BRIEF.logline, message: sp.idea.message || GOLDEN_BRIEF.message, audience: sp.idea.audience || GOLDEN_BRIEF.audience, feeling: sp.idea.feeling || GOLDEN_BRIEF.feeling, duration: Number(sp.idea.duration) || 60, style: sp.idea.style || GOLDEN_BRIEF.style };
    sp.dna.fields = { ...GOLDEN_DNA, 'Genre': sp.idea.style === 'Mockumentary' ? GOLDEN_DNA['Genre'] : sp.idea.style };
    if (!sp.rules.length) sp.rules = GOLDEN_RULES.map((r) => ({ ...r }));
    if (!sp.demo) sp.borrowed = true;
    sp.brief.status = 'needs_approval'; sp.dna.status = 'needs_approval';
    toast(`Film Brief v${sp.brief.version} og Film DNA er klar til gennemsyn.`); render();
  }, 2400);
}
